const ui = {
  view:'panel',
  range:{ mode:'dia', anchor: todayKey(), from:'', to:'' },
  panelFilter:{ seccion:'', proyecto:'' },
  regFilter:{ proyecto:'', desde:'', hasta:'', texto:'' },
  projFilter:{ seccion:'', estado:'activo', texto:'' },
  trackerFilter:{ proyecto:'' },
  ovFilter:{ desde:'', hasta:'' },
  editingEntryId:null,
  editingProjectId:null,
  manualMode:'fin',
  msg:{}
};

function say(text){ document.getElementById('live').textContent = text; }
function setMsg(view, text, kind){ ui.msg[view] = text ? { text, kind } : null; }
function msgHtml(view){
  const m = ui.msg[view];
  if(!m) return '<div class="msg"></div>';
  return '<div class="msg ' + (m.kind === 'err' ? 'err' : 'ok') + '" role="alert">' + esc(m.text) + '</div>';
}

function resolveRange(){
  const m = ui.range.mode;
  if(m === 'personalizado'){
    let a = isDayKey(ui.range.from) ? ui.range.from : todayKey();
    let b = isDayKey(ui.range.to) ? ui.range.to : a;
    if(a > b){ const t = a; a = b; b = t; }
    return { from:a, to:b };
  }
  const anchor = isDayKey(ui.range.anchor) ? ui.range.anchor : todayKey();
  const z = dayStartZ(anchor);
  if(m === 'semana'){
    const dow = new Date(z).getUTCDay();       // 0 = domingo
    const start = z - ((dow + 6) % 7) * DAY;   // la semana empieza el lunes
    return { from: dayKeyOf(start), to: dayKeyOf(start + 6 * DAY) };
  }
  if(m === 'mes'){
    const d = new Date(z);
    const first = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    const last = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0);
    return { from: dayKeyOf(first), to: dayKeyOf(last) };
  }
  if(m === 'anio'){
    const y = new Date(z).getUTCFullYear();
    return { from: dayKeyOf(Date.UTC(y, 0, 1)), to: dayKeyOf(Date.UTC(y, 11, 31)) };
  }
  return { from: anchor, to: anchor };
}

/* Resumen mes a mes de un año, para la vista Año (CR-04). Reutiliza
   `summarize()` en vez de recalcular: así el indicador de sobrecarga sale del
   mismo sitio en las cuatro vistas y no pueden divergir. */
function summarizeYear(anio){
  const meses = [];
  for(let m = 0; m < 12; m++){
    const from = dayKeyOf(Date.UTC(anio, m, 1));
    const to = dayKeyOf(Date.UTC(anio, m + 1, 0));
    const s = summarize(from, to);
    const diasRojos = s.days.filter(d => s.byDay[d].estado === 'rojo').length;
    const diasConDatos = s.days.filter(d => s.byDay[d].relojMin > 0).length;
    meses.push({
      mes: m, from, to, sum: s,
      diasRojos: diasRojos,
      diasConDatos: diasConDatos,
      // "Sobrecarga sostenida" = el mes entero pasado de la raya, o al menos
      // un tercio de sus días con datos en rojo. Un solo día pesado no marca
      // un mes; una racha sí.
      sostenida: s.estado === 'rojo' || (diasConDatos >= 3 && diasRojos / diasConDatos >= 0.34)
    });
  }
  return meses;
}
const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function rangeLabel(r){
  if(ui.range.mode === 'dia') return fmtDayLong(r.from);
  if(ui.range.mode === 'anio') return 'Año ' + new Date(dayStartZ(r.from)).getUTCFullYear();
  if(ui.range.mode === 'mes'){
    const d = new Date(dayStartZ(r.from));
    const s = d.toLocaleDateString('es-DO', { month:'long', year:'numeric', timeZone:'UTC' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  return fmtDayShort(r.from) + ' – ' + fmtDayShort(r.to) + ' de ' + new Date(dayStartZ(r.to)).getUTCFullYear();
}

function shiftRange(dir){
  if(ui.range.mode === 'personalizado') return;
  const z = dayStartZ(isDayKey(ui.range.anchor) ? ui.range.anchor : todayKey());
  const d = new Date(z);
  if(ui.range.mode === 'dia') ui.range.anchor = dayKeyOf(z + dir * DAY);
  else if(ui.range.mode === 'semana') ui.range.anchor = dayKeyOf(z + dir * 7 * DAY);
  else if(ui.range.mode === 'anio') ui.range.anchor = dayKeyOf(Date.UTC(d.getUTCFullYear() + dir, 0, 1));
  else ui.range.anchor = dayKeyOf(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + dir, 1));
}

/* ───────────────────── piezas de interfaz reutilizables ───────────────────── */

function projectOptions(selected, opts){
  const o = opts || {};
  const list = state.projects
    // Sueño y Comidas no se eligen al crear tiempo (se generan solos), pero sí
    // aparecen al filtrar y al editar uno de sus registros ya creados.
    .filter(p => (o.incluirSistema || !p.sistema) || p.id === selected)
    .filter(p => o.incluirArchivados ? true : p.estado === 'activo' || p.id === selected)
    .slice()
    .sort((a, b) => a.sectionId.localeCompare(b.sectionId) || a.nombre.localeCompare(b.nombre));
  let html = '<option value="">' + esc(o.vacio || 'Todos los proyectos') + '</option>';
  SECTIONS.forEach(sec => {
    const inSec = list.filter(p => p.sectionId === sec.id);
    if(!inSec.length) return;
    html += '<option disabled>── ' + esc(sec.nombre) + ' ──</option>';
    inSec.forEach(p => {
      html += '<option value="' + esc(p.id) + '"' + (p.id === selected ? ' selected' : '') + '>'
        + esc(p.nombre) + (p.estado === 'archivado' ? ' (archivado)' : '') + '</option>';
    });
  });
  return html;
}
function sectionOptions(selected, vacio, opts){
  const lista = (opts && opts.soloEditables) ? SECCIONES_EDITABLES : SECTIONS;
  let html = vacio ? '<option value="">' + esc(vacio) + '</option>' : '';
  lista.forEach(s => {
    html += '<option value="' + s.id + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.nombre) + '</option>';
  });
  return html;
}
function projectChip(p){
  if(!p) return '<span class="chip">(proyecto eliminado)</span>';
  return '<span class="swatch" style="background:' + safeColor(p.color) + '"></span>' + esc(p.nombre);
}
function barHtml(pct, over){
  const w = clamp(pct, 0, 100).toFixed(1);
  return '<div class="bar' + (over ? ' over' : '') + '"><span style="width:' + w + '%"></span></div>';
}

/* ───────────────────── vista: Panel ───────────────────── */

function renderPanel(){
  const r = resolveRange();
  const sum = summarize(r.from, r.to);
  const pct = sum.availMin > 0 ? (sum.relojMin / sum.availMin) * 100 : 0;
  const est = ESTADO_TEXTO[sum.estado];
  const topSec = sum.topSection ? sectionById(sum.topSection) : null;

  let mensaje;
  if(sum.estado === 'rojo'){
    mensaje = 'El tiempo registrado supera las horas disponibles del periodo ('
      + fmtDur(sum.relojMin) + ' de reloj sobre ' + fmtDur(sum.availMin) + ' disponibles).';
  }else if(sum.estado === 'amarillo'){
    mensaje = 'Vas por ' + Math.round(pct) + '% de las horas disponibles del periodo. Queda poco margen.';
  }else{
    mensaje = 'Llevas ' + fmtDur(sum.relojMin) + ' de las ' + fmtDur(sum.availMin) + ' disponibles en el periodo.';
  }
  if(topSec && sum.relojMin > 0){
    mensaje += ' La sección que más aporta es ' + topSec.nombre + ' ('
      + fmtDur(sum.bySection[topSec.id].relojMin) + ').';
  }

  /* Los filtros de abajo NO tocan este indicador a propósito: la sobrecarga
     de un día es la de todo el día, no la del proyecto que se esté mirando. */
  let html = '<div class="panel">'
    + '<h2>Periodo</h2>'
    + '<div class="row">'
    + '<div class="field"><label for="f-modo">Rango</label><select id="f-modo">'
    + ['dia','semana','mes','anio','personalizado'].map(m =>
        '<option value="' + m + '"' + (ui.range.mode === m ? ' selected' : '') + '>'
        + ({dia:'Día', semana:'Semana', mes:'Mes', anio:'Año', personalizado:'Personalizado'})[m] + '</option>').join('')
    + '</select></div>';

  if(ui.range.mode === 'personalizado'){
    html += '<div class="field"><label for="f-desde">Desde</label><input type="date" id="f-desde" value="' + esc(ui.range.from || r.from) + '"></div>'
      + '<div class="field"><label for="f-hasta">Hasta</label><input type="date" id="f-hasta" value="' + esc(ui.range.to || r.to) + '"></div>'
      + '<p class="hint" style="flex:1 1 100%">El rango personalizado se limita a un mismo año.</p>';
  }else{
    html += '<div class="field"><label for="f-ancla">Fecha</label><input type="date" id="f-ancla" value="' + esc(ui.range.anchor) + '"></div>'
      + '<div class="field"><button class="btn ghost" id="p-prev" aria-label="Periodo anterior">←</button></div>'
      + '<div class="field"><button class="btn ghost" id="p-hoy">Hoy</button></div>'
      + '<div class="field"><button class="btn ghost" id="p-next" aria-label="Periodo siguiente">→</button></div>';
  }
  html += '</div><p class="hint"><strong>' + esc(rangeLabel(r)) + '</strong> · ' + sum.days.length + ' día(s)'
    + (sum.liveCount ? ' · incluye ' + sum.liveCount + ' cronómetro(s) en curso, contados hasta ahora' : '')
    + '</p>' + msgHtml('panel') + '</div>';

  html += '<div class="panel"><h2>Estado de carga</h2>'
    + '<div class="estado-grid">'
    + '<div class="estado-ring">' + overloadRing(pct, sum.estado, sum.relojMin, sum.availMin) + '</div>'
    + '<div class="estado ' + est.clase + '" style="flex:1"><h3>' + esc(est.titulo) + '</h3><p>' + esc(mensaje) + '</p></div>'
    + '</div>'
    + '<p class="hint">La sobrecarga se mide con <strong>tiempo de reloj real</strong>: si dos actividades ocurren a la vez, esa franja cuenta una sola vez. Los filtros de más abajo no cambian este indicador.</p>'
    + '<div class="cards" style="margin-top:12px">'
    + statCard('Tiempo de reloj', fmtDur(sum.relojMin), 'Franjas solapadas contadas una vez')
    + statCard('Tiempo bruto', fmtDur(sum.brutoMin), 'Suma de todos los proyectos')
    + statCard('Disponible', fmtDur(sum.availMin), '24 h − sueño − comida por día')
    + statCard('Sin registrar', fmtDur(sum.sinRegistrarMin), 'Tiempo libre real del periodo')
    + '</div></div>';

  // ── Gráficos (CR-03) ──
  html += '<div class="panel"><h2>De un vistazo</h2><div class="chart-grid">'
    + '<div class="chart-box"><h3>Reparto por sección</h3>' + chartDonut(sum) + '</div>';
  if(sum.days.length > 1 && sum.days.length <= 62){
    html += '<div class="chart-box wide"><h3>Cómo se repartió cada día</h3>' + chartStackedDays(sum)
      + '<p class="hint">' + SECTIONS.map(s => '<span class="swatch" style="background:' + s.color + '"></span>' + esc(s.nombre)).join(' · ') + '</p></div>';
  }
  if(ui.range.mode === 'mes'){
    html += '<div class="chart-box"><h3>Calendario de carga</h3>' + chartHeatmap(sum) + '</div>';
  }
  const tendencia = sum.days.length > 8 ? chartWeeklyTrend(sum) : '';
  if(tendencia){
    html += '<div class="chart-box wide"><h3>Tendencia semana a semana</h3>' + tendencia + '</div>';
  }
  html += '</div></div>';

  // Bloques fijos
  html += '<div class="panel"><h2>Bloques fijos</h2><div class="cards">'
    + statCard('Sueño', fmtDur(sum.sleepMin), sum.days.length > 1 ? 'Total del periodo' : blockHours(r.from,'sueno') + ' h ese día')
    + statCard('Comida', fmtDur(sum.mealMin), sum.days.length > 1 ? 'Total del periodo' : blockHours(r.from,'comida') + ' h ese día')
    + '</div>';
  if(sum.days.length === 1){
    html += '<div class="row" style="margin-top:12px">'
      + '<div class="field"><label for="ov-sueno">Sueño de ' + esc(fmtDayShort(r.from)) + ' (horas)</label>'
      + '<input type="number" id="ov-sueno" min="0" max="24" step="0.5" value="' + blockHours(r.from,'sueno') + '"></div>'
      + '<div class="field"><label for="ov-comida">Comida de ' + esc(fmtDayShort(r.from)) + ' (horas)</label>'
      + '<input type="number" id="ov-comida" min="0" max="24" step="0.5" value="' + blockHours(r.from,'comida') + '"></div>'
      + '<div class="field"><button class="btn" id="ov-guardar">Guardar este día</button></div>'
      + '<div class="field"><button class="btn ghost" id="ov-reset">Volver al valor por defecto</button></div>'
      + '</div>';
  }else{
    html += '<p class="hint">Para ajustar el sueño o la comida de un día concreto, cambia el rango a «Día», o usa «Días fuera de lo habitual» en Ajustes.</p>';
  }
  html += '<p class="hint">Sueño y comidas se registran solos cada día y aparecen en el historial como cualquier otro registro. '
    + 'No compiten por tus horas disponibles: son justamente las que las definen, por eso no cuentan en el indicador de carga.</p>';
  html += '</div>';

  // Desglose con filtros
  html += '<div class="panel"><h2>Desglose por sección y proyecto</h2>'
    + '<div class="row">'
    + '<div class="field"><label for="pf-sec">Sección</label><select id="pf-sec">' + sectionOptions(ui.panelFilter.seccion, 'Todas las secciones', { soloEditables:true }) + '</select></div>'
    + '<div class="field grow"><label for="pf-proy">Proyecto</label><select id="pf-proy">' + projectOptions(ui.panelFilter.proyecto, { incluirArchivados:true, incluirSistema:true }) + '</select></div>'
    + '<div class="field"><button class="btn ghost" id="pf-limpiar">Limpiar filtros</button></div>'
    + '</div>';

  // Bloques Fijos no entra en este desglose: tiene su propia tarjeta y no
  // compite por las horas disponibles.
  const secsToShow = SECCIONES_EDITABLES.filter(s => !ui.panelFilter.seccion || s.id === ui.panelFilter.seccion);
  let algo = false;
  secsToShow.forEach(sec => {
    const secData = sum.bySection[sec.id];
    const projs = state.projects
      .filter(p => p.sectionId === sec.id)
      .filter(p => !ui.panelFilter.proyecto || p.id === ui.panelFilter.proyecto)
      .map(p => ({ p, d: sum.byProject[p.id] }))
      .filter(x => x.d && x.d.brutoMin > 0)
      .sort((a, b) => b.d.brutoMin - a.d.brutoMin);
    if(!projs.length && (!secData || ui.panelFilter.proyecto)) return;
    algo = true;
    html += '<h3><span class="swatch" style="background:' + sec.color + '"></span>' + esc(sec.nombre)
      + ' — ' + fmtDur(secData ? secData.relojMin : 0) + ' de reloj'
      + (secData && secData.brutoMin !== secData.relojMin ? ' <span class="muted">(' + fmtDur(secData.brutoMin) + ' brutas)</span>' : '')
      + '</h3>';
    if(!projs.length){ html += '<p class="empty">Sin tiempo registrado en esta sección durante el periodo.</p>'; return; }
    const maxMin = projs[0].d.brutoMin || 1;
    html += '<div class="tablewrap"><table><thead><tr><th>Proyecto</th><th class="num">Horas</th><th style="width:38%">Reparto</th></tr></thead><tbody>';
    projs.forEach(x => {
      html += '<tr><td>' + projectChip(x.p) + '</td><td class="num">' + esc(fmtDur(x.d.brutoMin)) + '</td>'
        + '<td>' + barHtml((x.d.brutoMin / maxMin) * 100, false) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  });
  if(!algo) html += '<p class="empty">No hay tiempo registrado con estos filtros en el periodo elegido.</p>';
  html += '</div>';

  // Metas plan vs. real
  const conMeta = state.projects
    .filter(p => p.metaHorasSemanales != null && p.metaHorasSemanales > 0)
    .filter(p => !ui.panelFilter.seccion || p.sectionId === ui.panelFilter.seccion)
    .filter(p => !ui.panelFilter.proyecto || p.id === ui.panelFilter.proyecto);
  html += '<div class="panel"><h2>Metas: plan vs. real</h2>';
  if(!conMeta.length){
    html += '<p class="empty">Ningún proyecto visible tiene meta de horas semanales. Puedes ponerle una en la pestaña Proyectos.</p>';
  }else{
    const factor = sum.days.length / 7;
    html += '<p class="hint">La meta semanal se ajusta al periodo elegido (' + sum.days.length + ' día(s) = '
      + factor.toFixed(2).replace('.', ',') + ' semanas).</p>'
      + '<div class="tablewrap"><table><thead><tr><th>Proyecto</th><th class="num">Meta</th><th class="num">Real</th><th class="num">Diferencia</th><th style="width:30%">Avance</th></tr></thead><tbody>';
    conMeta.forEach(p => {
      const metaMin = p.metaHorasSemanales * 60 * factor;
      const realMin = sum.byProject[p.id] ? sum.byProject[p.id].brutoMin : 0;
      const dif = realMin - metaMin;
      const pctMeta = metaMin > 0 ? (realMin / metaMin) * 100 : 0;
      html += '<tr><td>' + projectChip(p) + '</td>'
        + '<td class="num">' + esc(fmtDur(metaMin)) + '</td>'
        + '<td class="num">' + esc(fmtDur(realMin)) + '</td>'
        + '<td class="num">' + (dif >= 0 ? '+' : '−') + esc(fmtDur(Math.abs(dif))) + '</td>'
        + '<td>' + barHtml(pctMeta, pctMeta > 100) + '<span class="muted">' + Math.round(pctMeta) + '%</span></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // Vista Año: consolidado mes a mes (CR-04). Sustituye al detalle día a día,
  // que con 365 filas no se puede leer.
  if(ui.range.mode === 'anio'){
    const anio = new Date(dayStartZ(r.from)).getUTCFullYear();
    const meses = summarizeYear(anio);
    const conSobrecarga = meses.filter(m => m.sostenida).length;
    html += '<div class="panel"><h2>Mes a mes de ' + anio + '</h2>'
      + '<p class="hint">' + (conSobrecarga
          ? conSobrecarga + ' mes(es) con sobrecarga sostenida — el mes entero pasado de la raya, o al menos un tercio de sus días con datos en rojo.'
          : 'Ningún mes con sobrecarga sostenida este año.') + '</p>'
      + '<div class="tablewrap"><table><thead><tr><th>Mes</th><th class="num">Reloj</th><th class="num">Disponible</th>'
      + SECCIONES_EDITABLES.map(s => '<th class="num">' + esc(s.nombre) + '</th>').join('')
      + '<th class="num">Días en rojo</th><th>Estado</th></tr></thead><tbody>';
    meses.forEach(m => {
      const e = ESTADO_TEXTO[m.sum.estado];
      const tono = m.sum.estado === 'verde' ? 'verde' : m.sum.estado === 'amarillo' ? 'ambar' : 'rojo';
      html += '<tr><td>' + esc(MESES_CORTOS[m.mes]) + '</td>'
        + '<td class="num">' + esc(fmtDur(m.sum.relojMin)) + '</td>'
        + '<td class="num muted">' + esc(fmtDur(m.sum.availMin)) + '</td>'
        + SECCIONES_EDITABLES.map(s => '<td class="num">'
            + (m.sum.bySection[s.id] ? esc(fmtHoursShort(m.sum.bySection[s.id].brutoMin)) : '—') + '</td>').join('')
        + '<td class="num">' + m.diasRojos + '</td>'
        + '<td><span class="chip" style="background:var(--' + tono + '-bg);color:var(--' + tono + '-tx)">'
        + esc(e.titulo) + (m.sostenida ? ' · sostenida' : '') + '</span></td></tr>';
    });
    html += '</tbody></table></div></div>';
  }

  /* Detalle por día (rangos de más de un día, salvo el año). Va plegado: el
     panel tiene que leerse de un vistazo por los gráficos, no por una tabla de
     30 filas. Se conserva porque es el dato exacto, y porque es la alternativa
     accesible a los gráficos para quien use lector de pantalla. */
  if(sum.days.length > 1 && ui.range.mode !== 'anio'){
    html += '<details class="panel"><summary><h2 style="display:inline">Día por día (detalle)</h2></summary>'
      + '<div class="tablewrap" style="margin-top:12px"><table>'
      + '<thead><tr><th>Día</th><th class="num">Reloj</th><th class="num">Bruto</th><th class="num">Disponible</th><th>Estado</th></tr></thead><tbody>';
    // Un rango personalizado puede llegar a un año: se acota la tabla y se
    // dice cuántos días quedaron fuera, en vez de pintar 365 filas.
    const TOPE_FILAS = 62;
    const mostrados = sum.days.slice(0, TOPE_FILAS);
    mostrados.forEach(d => {
      const x = sum.byDay[d];
      const e = ESTADO_TEXTO[x.estado];
      const tono = x.estado === 'verde' ? 'verde' : x.estado === 'amarillo' ? 'ambar' : 'rojo';
      html += '<tr><td>' + esc(fmtDayShort(d)) + '</td>'
        + '<td class="num">' + esc(fmtDur(x.relojMin)) + '</td>'
        + '<td class="num">' + esc(fmtDur(x.brutoMin)) + '</td>'
        + '<td class="num">' + esc(fmtDur(x.availMin)) + '</td>'
        + '<td><span class="chip" style="background:var(--' + tono + '-bg);color:var(--'
        + tono + '-tx)">' + esc(e.titulo) + '</span></td></tr>';
    });
    html += '</tbody></table></div>';
    if(sum.days.length > TOPE_FILAS){
      html += '<p class="hint">Se muestran los primeros ' + TOPE_FILAS + ' días de los '
        + sum.days.length + ' del periodo. Acota el rango para ver el resto.</p>';
    }
    html += '</details>';
  }

  return html;
}

/* ═══════════════ GRÁFICOS DEL PANEL (CR-03) ═══════════════
   Todo se dibuja a mano en SVG: el hub no carga librerías de gráficos y este
   archivo tiene que seguir funcionando sin red. Cada gráfico lleva
   `role="img"` con un resumen en `aria-label`, porque un SVG de barras no
   dice nada por sí solo a un lector de pantalla; el detalle exacto sigue
   estando en las tablas de más abajo, que no se quitaron. */

const COLOR_SECCION = {};
SECTIONS.forEach(s => { COLOR_SECCION[s.id] = s.color; });

// Anillo de sobrecarga: es lo primero que se ve al abrir el panel.
function overloadRing(pct, estado, relojMin, availMin){
  const R = 52, C = 2 * Math.PI * R;
  const frac = clamp(pct / 100, 0, 1);
  const tono = estado === 'verde' ? '#2E7D53' : estado === 'amarillo' ? '#B8862F' : '#B0453A';
  const resto = Math.max(0, availMin - relojMin);
  return '<svg class="ring" viewBox="0 0 130 130" role="img" aria-label="'
    + esc(Math.round(pct) + ' por ciento de las horas disponibles usado: '
      + fmtDur(relojMin) + ' de ' + fmtDur(availMin) + '. Estado: ' + ESTADO_TEXTO[estado].titulo) + '">'
    + '<circle cx="65" cy="65" r="' + R + '" fill="none" stroke="#E8EBE7" stroke-width="15"/>'
    + '<circle cx="65" cy="65" r="' + R + '" fill="none" stroke="' + tono + '" stroke-width="15"'
    + ' stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '"'
    + ' transform="rotate(-90 65 65)"/>'
    + '<text x="65" y="61" text-anchor="middle" font-size="25" font-weight="700" fill="#16212B">' + Math.round(pct) + '%</text>'
    + '<text x="65" y="80" text-anchor="middle" font-size="10.5" fill="#5C6670">'
    + esc(pct > 100 ? 'de más' : 'libre ' + fmtHoursShort(resto)) + '</text>'
    + '</svg>';
}

// Barras apiladas: cómo se repartió cada día por sección.
function chartStackedDays(sum){
  const days = sum.days;
  if(!days.length) return '';
  const totales = days.map(d => SECTIONS.reduce((a, s) => a + (sum.byDay[d].porSeccion[s.id] || 0), 0));
  const maxMin = Math.max(24 * 60, Math.max.apply(null, totales));
  const W = 720, H = 190, pad = 26;
  const bw = (W - pad * 2) / days.length;
  const ancho = Math.min(bw * 0.68, 34);
  let barras = '', ejes = '';
  // Líneas guía cada 6 h, para poder leer la altura sin contar cuadritos.
  for(let h = 6; h <= maxMin / 60; h += 6){
    const y = H - pad - (h * 60 / maxMin) * (H - pad * 2);
    ejes += '<line x1="' + pad + '" y1="' + y.toFixed(1) + '" x2="' + (W - pad) + '" y2="' + y.toFixed(1)
      + '" stroke="#E8EBE7" stroke-width="1"/>'
      + '<text x="4" y="' + (y + 3.5).toFixed(1) + '" font-size="9.5" fill="#5C6670">' + h + 'h</text>';
  }
  days.forEach((d, i) => {
    const cx = pad + bw * i + bw / 2 - ancho / 2;
    let y = H - pad;
    SECTIONS.forEach(s => {
      const min = sum.byDay[d].porSeccion[s.id] || 0;
      if(min <= 0) return;
      const alto = (min / maxMin) * (H - pad * 2);
      y -= alto;
      barras += '<rect x="' + cx.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + ancho.toFixed(1)
        + '" height="' + alto.toFixed(1) + '" fill="' + s.color + '" opacity="' + (s.id === 'fijos' ? '0.5' : '0.92') + '"/>';
    });
    // Etiqueta del día: en rangos largos solo cada cierto número, o se pisan.
    const cada = days.length > 24 ? 5 : days.length > 12 ? 2 : 1;
    if(i % cada === 0){
      barras += '<text x="' + (cx + ancho / 2).toFixed(1) + '" y="' + (H - pad + 13)
        + '" font-size="9.5" fill="#5C6670" text-anchor="middle">'
        + new Date(dayStartZ(d)).getUTCDate() + '</text>';
    }
  });
  const total = totales.reduce((a, b) => a + b, 0);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
    + esc('Barras apiladas de ' + days.length + ' día(s), con el reparto de cada día por sección. '
      + 'Total del periodo: ' + fmtDur(total) + '. El detalle exacto está en la tabla siguiente.') + '">'
    + ejes + barras + '</svg>';
}

// Dona por sección, incluidos los bloques fijos.
function chartDonut(sum){
  const trozos = SECTIONS.map(s => ({
    s,
    min: s.id === 'fijos'
      ? sum.sleepMin + sum.mealMin
      : (sum.bySection[s.id] ? sum.bySection[s.id].brutoMin : 0)
  })).filter(t => t.min > 0);
  const total = trozos.reduce((a, t) => a + t.min, 0);
  if(!total) return '<p class="empty">Sin tiempo registrado en el periodo.</p>';

  const R = 54, r = 33, cx = 70, cy = 70;
  let ang = -Math.PI / 2, paths = '';
  trozos.forEach(t => {
    const barrido = (t.min / total) * Math.PI * 2;
    const fin = ang + barrido;
    const grande = barrido > Math.PI ? 1 : 0;
    const pt = (a, rad) => [(cx + Math.cos(a) * rad).toFixed(2), (cy + Math.sin(a) * rad).toFixed(2)];
    // Un solo trozo al 100% no se puede dibujar como arco (inicio y fin
    // coinciden): en ese caso van dos anillos completos.
    if(trozos.length === 1){
      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2) + '" fill="none" stroke="'
        + t.s.color + '" stroke-width="' + (R - r) + '"/>';
    }else{
      const a1 = pt(ang, R), a2 = pt(fin, R), b1 = pt(fin, r), b2 = pt(ang, r);
      paths += '<path d="M' + a1[0] + ',' + a1[1] + ' A' + R + ',' + R + ' 0 ' + grande + ' 1 ' + a2[0] + ',' + a2[1]
        + ' L' + b1[0] + ',' + b1[1] + ' A' + r + ',' + r + ' 0 ' + grande + ' 0 ' + b2[0] + ',' + b2[1]
        + ' Z" fill="' + t.s.color + '"/>';
    }
    ang = fin;
  });
  const resumen = trozos.map(t => t.s.nombre + ' ' + Math.round(t.min / total * 100) + '%').join(', ');
  const leyenda = trozos.map(t => '<li><span class="swatch" style="background:' + t.s.color + '"></span>'
    + esc(t.s.nombre) + ' <strong>' + Math.round(t.min / total * 100) + '%</strong> '
    + '<span class="muted">' + esc(fmtHoursShort(t.min)) + '</span></li>').join('');
  return '<div class="donut-wrap">'
    + '<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="' + esc('Reparto por sección: ' + resumen) + '">'
    + paths
    + '<text x="70" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#16212B">' + esc(fmtHoursShort(total)) + '</text>'
    + '<text x="70" y="82" text-anchor="middle" font-size="9" fill="#5C6670">en total</text>'
    + '</svg><ul class="donut-legend">' + leyenda + '</ul></div>';
}

// Línea de tendencia semanal: ¿la carga sube o baja?
function chartWeeklyTrend(sum){
  const semanas = [];
  sum.days.forEach(d => {
    const z = dayStartZ(d);
    const lunes = dayKeyOf(z - ((new Date(z).getUTCDay() + 6) % 7) * DAY);
    let w = semanas[semanas.length - 1];
    if(!w || w.lunes !== lunes){ w = { lunes, relojMin:0, availMin:0 }; semanas.push(w); }
    w.relojMin += sum.byDay[d].relojMin;
    w.availMin += sum.byDay[d].availMin;
  });
  if(semanas.length < 2) return '';
  const W = 720, H = 170, pad = 30;
  const maxMin = Math.max.apply(null, semanas.map(w => Math.max(w.relojMin, w.availMin))) || 1;
  const x = (i) => pad + (semanas.length === 1 ? 0 : (i * (W - pad * 2)) / (semanas.length - 1));
  const y = (m) => H - pad - (m / maxMin) * (H - pad * 2);
  const linea = semanas.map((w, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(w.relojMin).toFixed(1)).join(' ');
  const disp = semanas.map((w, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(w.availMin).toFixed(1)).join(' ');
  const puntos = semanas.map((w, i) => {
    const est = statusOf(w.relojMin, w.availMin);
    const tono = est === 'verde' ? '#2E7D53' : est === 'amarillo' ? '#B8862F' : '#B0453A';
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(w.relojMin).toFixed(1) + '" r="4.2" fill="' + tono + '"/>';
  }).join('');
  const etiquetas = semanas.map((w, i) => {
    const cada = semanas.length > 12 ? 3 : 1;
    if(i % cada) return '';
    return '<text x="' + x(i).toFixed(1) + '" y="' + (H - pad + 14) + '" font-size="9.5" fill="#5C6670" text-anchor="middle">'
      + esc(fmtDayShort(w.lunes)) + '</text>';
  }).join('');
  const primera = semanas[0].relojMin, ultima = semanas[semanas.length - 1].relojMin;
  const rumbo = ultima > primera * 1.1 ? 'subiendo' : ultima < primera * 0.9 ? 'bajando' : 'estable';
  /* El color de cada punto era la única señal del estado de esa semana, y en
     la vista Año no hay tabla diaria que sirva de respaldo. Se cuentan aquí en
     texto, para que el dato no dependa de distinguir verde de rojo. */
  const cuenta = { verde:0, amarillo:0, rojo:0 };
  semanas.forEach(w => { cuenta[statusOf(w.relojMin, w.availMin)]++; });
  const resumenEstados = cuenta.rojo + ' semana(s) con sobrecarga, ' + cuenta.amarillo
    + ' al límite y ' + cuenta.verde + ' bien';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
    + esc('Tendencia de ' + semanas.length + ' semanas: la carga va ' + rumbo
      + '. De ' + fmtDur(primera) + ' la primera semana a ' + fmtDur(ultima) + ' la última. '
      + resumenEstados + '.') + '">'
    + '<path d="' + disp + '" fill="none" stroke="#B6BEB8" stroke-width="1.6" stroke-dasharray="5 4"/>'
    + '<path d="' + linea + '" fill="none" stroke="#1F6763" stroke-width="2.6" stroke-linejoin="round"/>'
    + puntos + etiquetas + '</svg>'
    + '<p class="hint"><span class="swatch" style="background:#1F6763"></span> Horas registradas · '
    + '<span class="swatch" style="background:#B6BEB8"></span> Horas disponibles · la carga va <strong>' + rumbo + '</strong></p>'
    + '<p class="hint">Cada punto es una semana: '
    + '<span class="swatch" style="background:#B0453A"></span> <strong>' + cuenta.rojo + '</strong> con sobrecarga · '
    + '<span class="swatch" style="background:#B8862F"></span> <strong>' + cuenta.amarillo + '</strong> al límite · '
    + '<span class="swatch" style="background:#2E7D53"></span> <strong>' + cuenta.verde + '</strong> bien</p>';
}

// Heatmap tipo calendario: un cuadrito por día, coloreado por su estado.
function chartHeatmap(sum){
  const days = sum.days;
  if(!days.length) return '';
  const primera = dayStartZ(days[0]);
  const offset = (new Date(primera).getUTCDay() + 6) % 7; // 0 = lunes
  const cel = 30, gap = 4, W = 7 * (cel + gap) - gap;
  const filas = Math.ceil((offset + days.length) / 7);
  const H = filas * (cel + gap) - gap + 18;
  const TONO = { verde:'#BFE3CE', amarillo:'#F2DFAE', rojo:'#EFBDB4' };
  const BORDE = { verde:'#7FBF9C', amarillo:'#D2AC5E', rojo:'#C98376' };
  let celdas = '';
  days.forEach((d, i) => {
    const pos = offset + i;
    const cx = (pos % 7) * (cel + gap);
    const cy = 18 + Math.floor(pos / 7) * (cel + gap);
    const x = sum.byDay[d];
    const vacio = x.relojMin === 0;
    celdas += '<rect x="' + cx + '" y="' + cy + '" width="' + cel + '" height="' + cel + '" rx="6"'
      + ' fill="' + (vacio ? '#F1F3F0' : TONO[x.estado]) + '"'
      + ' stroke="' + (vacio ? '#E2E5E0' : BORDE[x.estado]) + '" stroke-width="1"/>'
      // El número de los días sin registrar iba en #9AA29B, que sobre el gris
      // de la celda da 2,35:1 y no llega al mínimo de AA. Con --muted sube a
      // ~5:1 y el día se sigue leyendo como "apagado" por el relleno.
      + '<text x="' + (cx + cel / 2) + '" y="' + (cy + cel / 2 + 3.5) + '" text-anchor="middle" font-size="10.5"'
      + ' fill="' + (vacio ? '#5C6670' : '#16212B') + '">' + new Date(dayStartZ(d)).getUTCDate() + '</text>';
  });
  const cab = ['L','M','X','J','V','S','D'].map((n, i) =>
    '<text x="' + (i * (cel + gap) + cel / 2) + '" y="10" text-anchor="middle" font-size="9.5" fill="#5C6670">' + n + '</text>').join('');
  const cuenta = { verde:0, amarillo:0, rojo:0 };
  days.forEach(d => { if(sum.byDay[d].relojMin > 0) cuenta[sum.byDay[d].estado]++; });
  return '<svg class="heatmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
    + esc('Calendario de carga: ' + cuenta.rojo + ' día(s) en rojo, ' + cuenta.amarillo
      + ' en amarillo y ' + cuenta.verde + ' en verde. Los días sin color no tienen tiempo registrado.') + '">'
    + cab + celdas + '</svg>'
    + '<p class="hint">'
    + '<span class="swatch" style="background:#BFE3CE"></span> Bien (' + cuenta.verde + ') · '
    + '<span class="swatch" style="background:#F2DFAE"></span> Al límite (' + cuenta.amarillo + ') · '
    + '<span class="swatch" style="background:#EFBDB4"></span> Sobrecarga (' + cuenta.rojo + ') · '
    + '<span class="swatch" style="background:#F1F3F0"></span> Sin registrar</p>';
}

/* ───────────────────── vista: Cronómetros ───────────────────── */

function isPaused(t){
  const ps = t.pausedIntervals || [];
  return ps.length > 0 && !ps[ps.length - 1].to;
}
function trackerElapsed(t, nowMs){
  const s = Date.parse(t.startedAt);
  let paused = 0;
  (t.pausedIntervals || []).forEach(p => {
    const ps = Date.parse(p.from);
    const pe = p.to ? Date.parse(p.to) : nowMs;
    if(pe > ps) paused += pe - ps;
  });
  return Math.max(0, nowMs - s - paused);
}

function renderTrackers(){
  const activos = state.projects.filter(p => p.estado === 'activo');
  let html = '<div class="panel"><h2>Iniciar un cronómetro</h2>';

      + projectOptions('', { vacio:'Elige un proyecto' }) + '</select></div>'
      + '<div class="field grow"><label for="tr-nota">Nota (opcional)</label><input type="text" id="tr-nota" maxlength="200" placeholder="En qué estás trabajando"></div>'
      + '<div class="field"><button class="btn" id="tr-start">▶ Iniciar</button></div>'
      + '</div>'
      + '<p class="hint">Puedes tener varios cronómetros corriendo a la vez, incluso dos del mismo proyecto: ambos suman a ese proyecto, y el tiempo solapado cuenta una sola vez en el reloj del día.</p>';
  }
  html += msgHtml('trackers') + '</div>';

  const nowMs = Date.now();
  let lista = state.activeTrackers.slice();
  if(ui.trackerFilter.proyecto) lista = lista.filter(t => t.projectId === ui.trackerFilter.proyecto);

  html += '<div class="panel"><h2>En curso (' + state.activeTrackers.length + ')</h2>';
  if(state.activeTrackers.length > 1){
    html += '<div class="row" style="margin-bottom:10px">'
      + '<div class="field grow"><label for="trf-proy">Filtrar por proyecto</label><select id="trf-proy">'
      + projectOptions(ui.trackerFilter.proyecto, { incluirArchivados:true }) + '</select></div></div>';
  }
  if(!state.activeTrackers.length){
    html += '<p class="empty">No hay cronómetros corriendo.</p>';
  }else if(!lista.length){
    html += '<p class="empty">Ningún cronómetro coincide con el filtro.</p>';
  }else{
    lista.forEach(t => {
      const p = projectById(t.projectId);
      const pausado = isPaused(t);
      const stale = (nowMs - Date.parse(t.startedAt)) > staleMs();
      html += '<div class="tracker' + (pausado ? ' paused' : '') + '">'
        + '<div><div>' + projectChip(p) + (pausado ? ' <span class="chip">En pausa</span>' : '')
        + (stale ? ' <span class="chip" style="background:var(--rojo-bg);color:var(--rojo-tx)">Lleva mucho tiempo</span>' : '')
        + '</div>'
        + '<div class="t-time" data-elapsed="' + esc(t.id) + '">' + fmtClock(trackerElapsed(t, nowMs)) + '</div>'
        + '<div class="muted">Inició ' + esc(fmtDayShort(dayKeyOf(toZoned(Date.parse(t.startedAt))))) + ' a las '
        + esc(hhmmOf(toZoned(Date.parse(t.startedAt)))) + (t.nota ? ' · ' + esc(t.nota) : '') + '</div></div>'
        + '<div class="row" style="align-items:center">'
        + (pausado
            ? '<button class="btn ghost small" data-act="resume" data-id="' + esc(t.id) + '">▶ Reanudar</button>'
            : '<button class="btn ghost small" data-act="pause" data-id="' + esc(t.id) + '">⏸ Pausar</button>')
        + '<button class="btn small" data-act="stop" data-id="' + esc(t.id) + '">⏹ Detener y guardar</button>'
        + '<button class="btn danger small" data-act="discard" data-id="' + esc(t.id) + '">Descartar</button>'
        + '</div></div>';
    });
  }
  html += '</div>';
  return html;
}

function staleMs(){
  return clamp(num(state.settings.staleTrackerAlertHours, DEFAULTS.staleTrackerAlertHours), 1, 48) * 3600000;
}

function wireTrackers(root){
  const start = root.querySelector('#tr-start');
  if(start) start.addEventListener('click', () => {
    const sel = root.querySelector('#tr-proy');
    const nota = root.querySelector('#tr-nota');
    if(!sel.value){ setMsg('trackers','Elige un proyecto antes de iniciar el cronómetro.','err'); render(); return; }
    state.activeTrackers.push({
      id: uid('t'), projectId: sel.value,
      startedAt: new Date().toISOString(),
      pausedIntervals: [], nota: (nota.value || '').slice(0, 200)
    });
    save();
    setMsg('trackers','Cronómetro iniciado.','ok');
    say('Cronómetro iniciado para ' + projectName(sel.value));
    render();
    /* Aquí es donde puede abrirse sola la ventana flotante: este clic es el
       gesto que el navegador exige, y cambiar de pestaña no lo es. Abriéndola
       al arrancar el cronómetro, cuando la usuaria se va a otra pestaña la
       ventana ya está puesta, sin haber tenido que pulsar nada aparte. Un
       cronómetro nuevo es también el punto natural para volver a ofrecerla
       si la había cerrado a mano en la tanda anterior. */
    pipCerradaAMano = false;
    abrirVentanaSiCorresponde();
  });
  const filtro = root.querySelector('#trf-proy');
  if(filtro) filtro.addEventListener('change', () => { ui.trackerFilter.proyecto = filtro.value; render(); });

  root.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => trackerAction(btn.dataset.act, btn.dataset.id));
  });
}

function trackerAction(act, id){
  const t = state.activeTrackers.find(x => x.id === id);
  if(!t) return;
  const nowIso = new Date().toISOString();
  if(act === 'pause'){
    if(!isPaused(t)) t.pausedIntervals.push({ from: nowIso, to: null });
    save(); setMsg('trackers','Cronómetro en pausa.','ok'); say('Cronómetro en pausa');
  }else if(act === 'resume'){
    if(isPaused(t)) t.pausedIntervals[t.pausedIntervals.length - 1].to = nowIso;
    save(); setMsg('trackers','Cronómetro reanudado.','ok'); say('Cronómetro reanudado');
  }else if(act === 'stop'){
    const guardado = stopTracker(t, nowIso);
    if(guardado){
      setMsg('trackers','Cronómetro detenido y guardado como registro de ' + fmtDur(guardado.duracionMin) + '.','ok');
      say('Cronómetro detenido y guardado');
    }else{
      // Sin esto el mensaje decía "guardado como registro" aunque no se
      // hubiera guardado nada: éxito falso sobre una pérdida de datos.
      setMsg('trackers','El cronómetro se detuvo, pero NO se guardó ningún registro: todo su tiempo estaba en pausa.','err');
      say('Cronómetro detenido sin tiempo que guardar');
    }
  }else if(act === 'discard'){
    if(!confirm('¿Descartar este cronómetro sin guardar el tiempo?')) return;
    state.activeTrackers = state.activeTrackers.filter(x => x.id !== id);
    save(); setMsg('trackers','Cronómetro descartado.','ok'); say('Cronómetro descartado');
  }
  render();
  // Si el aviso de olvidado estaba abierto, ponerlo al día: la acción pudo
  // venir de la ventana aparte, que es otro documento.
  refrescarAvisoStale();
}

function stopTracker(t, endIso){
  // Las pausas se guardan dentro del registro: sin ellas, el tiempo de reloj
  // del día contaría también los ratos en pausa.
  const pausas = (t.pausedIntervals || [])
    .map(p => ({ from: p.from, to: p.to || endIso }))
    .filter(p => Date.parse(p.to) > Date.parse(p.from));
  const entry = {
    id: uid('e'), projectId: t.projectId, origen:'tracker',
    inicio: t.startedAt, fin: endIso, duracionMin: 0,
    nota: t.nota || '', editado:false, pausas: pausas
  };
  entry.duracionMin = activeMinutes(entry);
  // Devuelve el registro creado, o null si no había tiempo activo que
  // guardar (todo el rato quedó dentro de las pausas). Quien llama tiene que
  // avisar de la diferencia: detener un cronómetro y no guardar nada es una
  // pérdida de datos, no un éxito.
  const guardado = entry.duracionMin > 0 ? entry : null;
  if(guardado) state.entries.push(entry);
  state.activeTrackers = state.activeTrackers.filter(x => x.id !== t.id);
  save();
  return guardado;
}

      + '<label class="sr-only" for="re-dur">Duración en minutos</label>'
      + '<input type="number" id="re-dur" min="1" max="1440" step="5" value="' + esc(dur) + '"' + (ui.manualMode === 'dur' ? '' : ' disabled') + '></div>'
      + '</div><p class="hint">Si la hora de fin es igual o anterior a la de inicio, se entiende que la sesión terminó al día siguiente.</p></fieldset>'

    + '<div class="field"><label for="rf-desde">Desde</label><input type="date" id="rf-desde" value="' + esc(f.desde) + '"></div>'

        + '<button class="btn danger small" data-del="' + esc(e.id) + '">Eliminar</button></td></tr>';

    if(filtrados.length > 300) html += '<p class="hint">Se muestran los 300 registros más recientes de los ' + filtrados.length + ' que coinciden. Acota el rango de fechas para ver el resto.</p>';
  }
  html += '</div>';
  return html;
}

function filteredEntries(){
  const f = ui.regFilter;
  const texto = f.texto.trim().toLowerCase();
  return state.entries.filter(e => {
    if(f.proyecto && e.projectId !== f.proyecto) return false;
    const dk = dayKeyOf(toZoned(Date.parse(e.inicio)));
    const dkFin = dayKeyOf(toZoned(Date.parse(e.fin)));
    if(isDayKey(f.desde) && dkFin < f.desde) return false;
    if(isDayKey(f.hasta) && dk > f.hasta) return false;
    if(texto){
      const hay = (e.nota || '').toLowerCase() + ' ' + projectName(e.projectId).toLowerCase();
      if(hay.indexOf(texto) === -1) return false;
    }
    return true;
  }).sort((a, b) => Date.parse(b.inicio) - Date.parse(a.inicio));
}

    render();
    const el = document.getElementById('re-proy');
    if(el){ el.focus(); el.scrollIntoView({ block:'center' }); }
  }));
  root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const e = state.entries.find(x => x.id === b.dataset.del);
    if(!e) return;
    if(!confirm('¿Eliminar este registro de ' + fmtDur(e.duracionMin) + ' en «' + projectName(e.projectId) + '»?')) return;
    state.entries = state.entries.filter(x => x.id !== e.id);
    if(ui.editingEntryId === e.id) ui.editingEntryId = null;
    save();
    setMsg('registros','Registro eliminado.','ok');
    say('Registro eliminado');
    render();
  }));
}

function saveManualEntry(root){
  const editando = ui.editingEntryId ? state.entries.find(e => e.id === ui.editingEntryId) : null;
  const proy = root.querySelector('#re-proy').value;
  let fecha = root.querySelector('#re-fecha').value;
  const hi = root.querySelector('#re-inicio').value;
  const modo = ui.manualMode;
  const hf = root.querySelector('#re-fin').value;
  const durVal = root.querySelector('#re-dur').value;

  /* Un bloque fijo tampoco cambia de día. Moverlo a una fecha que ya tiene su
     propio registro automático haría que ese día contara las horas dos veces,
     y el día de origen se quedaría en silencio con el valor por defecto. Para
     cambiar el sueño de otro día se edita el registro de ese día. */
  if(editando && esEntradaFija(editando)){
    fecha = dayKeyOf(toZoned(Date.parse(editando.inicio)));
  }

  if(!proy){ setMsg('registros','Elige un proyecto.','err'); render(); return; }
  if(!isDayKey(fecha)){ setMsg('registros','Elige una fecha válida.','err'); render(); return; }
  if(!/^\d{2}:\d{2}$/.test(hi)){ setMsg('registros','Indica la hora de inicio.','err'); render(); return; }

  const inicioIso = isoFromLocal(fecha, hi);
  if(!inicioIso){ setMsg('registros','No se pudo interpretar la fecha y hora de inicio.','err'); render(); return; }

  let finIso;
  if(modo === 'dur'){
    const d = Math.round(num(durVal, 0));
    if(!(d > 0)){ setMsg('registros','La duración tiene que ser mayor que cero.','err'); render(); return; }
    if(d > 1440){ setMsg('registros','La duración máxima de un registro es 24 horas (1440 minutos).','err'); render(); return; }
    finIso = new Date(Date.parse(inicioIso) + d * 60000).toISOString();
  }else{
    if(!/^\d{2}:\d{2}$/.test(hf)){ setMsg('registros','Indica la hora de fin, o cambia a duración.','err'); render(); return; }
    let z = Date.parse(fecha + 'T' + hf + ':00Z');
    const zi = Date.parse(fecha + 'T' + hi + ':00Z');
    if(z <= zi) z += DAY; // termina al día siguiente
    finIso = new Date(fromZoned(z)).toISOString();
  }

  const editing = editando;
  const nota = (root.querySelector('#re-nota').value || '').slice(0, 200);
  if(editing){
    // Los campos van deshabilitados para los bloques fijos, pero la
    // comprobación se repite aquí: deshabilitar un control es una ayuda de la
    // interfaz, no una garantía de que el valor no llegue de otra forma.
    editing.projectId = esEntradaFija(editing) ? editing.projectId : proy;
    editing.inicio = inicioIso;
    editing.fin = finIso;
    editing.nota = nota;
    editing.editado = true;
    editing.duracionMin = activeMinutes(editing);
    if(editing.duracionMin <= 0){
      setMsg('registros','El registro quedaría en cero minutos. Revisa el horario.','err'); render(); return;
    }
    ui.editingEntryId = null;
    save();
    setMsg('registros','Registro actualizado.','ok');
    say('Registro actualizado');
  }else{
    const entry = {
      id: uid('e'), projectId: proy, origen:'manual',
      inicio: inicioIso, fin: finIso, duracionMin: 0,
      nota: nota, editado:false, pausas: []
    };
    entry.duracionMin = activeMinutes(entry);
    if(entry.duracionMin <= 0){ setMsg('registros','El registro quedaría en cero minutos. Revisa el horario.','err'); render(); return; }
    state.entries.push(entry);
    save();
    setMsg('registros','Registro de ' + fmtDur(entry.duracionMin) + ' agregado.','ok');
    say('Registro agregado');
  }
  render();
}

function wireProyectos(root){
  const guardar = root.querySelector('#pr-guardar');
  if(guardar) guardar.addEventListener('click', () => {
    const nombre = (root.querySelector('#pr-nombre').value || '').trim().slice(0, 80);
    const sec = root.querySelector('#pr-sec').value;
    const color = safeColor(root.querySelector('#pr-color').value);
    const metaRaw = root.querySelector('#pr-meta').value;
    const estado = root.querySelector('#pr-estado').value === 'archivado' ? 'archivado' : 'activo';
    if(!nombre){ setMsg('proyectos','El proyecto necesita un nombre.','err'); render(); return; }
    if(!SECCIONES_EDITABLES.some(x => x.id === sec)){ setMsg('proyectos','Sección no válida.','err'); render(); return; }
    const meta = metaRaw === '' ? null : clamp(num(metaRaw, 0), 0, 168);

    const editing = ui.editingProjectId ? projectById(ui.editingProjectId) : null;
    const dup = state.projects.some(p => p.nombre.toLowerCase() === nombre.toLowerCase() && (!editing || p.id !== editing.id));
    if(dup){ setMsg('proyectos','Ya existe un proyecto con ese nombre.','err'); render(); return; }

    if(editing){
      Object.assign(editing, { nombre, sectionId:sec, color, metaHorasSemanales:meta, estado });
      ui.editingProjectId = null;
      setMsg('proyectos','Proyecto actualizado.','ok');
      say('Proyecto actualizado');
    }else{
      state.projects.push({ id: uid('p'), sectionId:sec, nombre, color, estado, metaHorasSemanales:meta });
      setMsg('proyectos','Proyecto creado.','ok');
      say('Proyecto creado');
    }
    save();
    render();
  });
  const cancelar = root.querySelector('#pr-cancelar');
  if(cancelar) cancelar.addEventListener('click', () => { ui.editingProjectId = null; setMsg('proyectos','',''); render(); });

  const bind = (id, key) => {
    const el = root.querySelector('#' + id);
    if(el) el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      ui.projFilter[key] = el.value;
      renderInto('proyectos', true);
    });
  };
  bind('pjf-sec','seccion'); bind('pjf-estado','estado'); bind('pjf-texto','texto');
  const limpiar = root.querySelector('#pjf-limpiar');
  if(limpiar) limpiar.addEventListener('click', () => { ui.projFilter = { seccion:'', estado:'', texto:'' }; render(); });

  root.querySelectorAll('[data-pedit]').forEach(b => b.addEventListener('click', () => {
    ui.editingProjectId = b.dataset.pedit;
    setMsg('proyectos','','');
    render();
    const el = document.getElementById('pr-nombre');
    if(el){ el.focus(); el.scrollIntoView({ block:'center' }); }
  }));
  root.querySelectorAll('[data-parch]').forEach(b => b.addEventListener('click', () => {
    const p = projectById(b.dataset.parch);
    if(!p) return;
    p.estado = p.estado === 'archivado' ? 'activo' : 'archivado';
    save();
    setMsg('proyectos','«' + p.nombre + '» ahora está ' + (p.estado === 'archivado' ? 'archivado' : 'activo') + '.','ok');
    say('Proyecto ' + p.estado);
    render();
  }));
  root.querySelectorAll('[data-pdel]').forEach(b => b.addEventListener('click', () => {
    const p = projectById(b.dataset.pdel);
    if(!p) return;
    const nEntries = state.entries.filter(e => e.projectId === p.id).length;
    const nTrack = state.activeTrackers.filter(t => t.projectId === p.id).length;
    const aviso = '¿Eliminar el proyecto «' + p.nombre + '»?'
      + (nEntries ? '\n\nSe borrarán también sus ' + nEntries + ' registro(s) de tiempo.' : '')
      + (nTrack ? '\nSe descartarán ' + nTrack + ' cronómetro(s) en curso.' : '')
      + '\n\nSi solo quieres dejar de verlo, usa «Archivar»: eso conserva el historial.';
    if(!confirm(aviso)) return;
    state.projects = state.projects.filter(x => x.id !== p.id);
    state.entries = state.entries.filter(e => e.projectId !== p.id);
    state.activeTrackers = state.activeTrackers.filter(t => t.projectId !== p.id);
    if(ui.editingProjectId === p.id) ui.editingProjectId = null;
    save();
    setMsg('proyectos','Proyecto eliminado.','ok');
    say('Proyecto eliminado');
    render();
  }));
}
