const TIMEZONES = ['America/Santo_Domingo','America/New_York','America/Chicago','America/Bogota','America/Mexico_City','Europe/Madrid','UTC'];

function renderAjustes(){
  const s = state.settings;
  let html = '<div class="panel"><h2>Preferencias</h2><div class="row">'
    + '<div class="field grow"><label for="aj-tz">Zona horaria</label><select id="aj-tz">'
    + TIMEZONES.concat(TIMEZONES.indexOf(s.timezone) === -1 ? [s.timezone] : [])
        .map(t => '<option value="' + esc(t) + '"' + (t === s.timezone ? ' selected' : '') + '>' + esc(t) + '</option>').join('')
    + '</select></div>'
    + '<div class="field"><label for="aj-sueno">Sueño por defecto (horas)</label><input type="number" id="aj-sueno" min="0" max="24" step="0.5" value="' + esc(s.sleepHoursDefault) + '"></div>'
    + '<div class="field"><label for="aj-comida">Comida por defecto (horas)</label><input type="number" id="aj-comida" min="0" max="24" step="0.5" value="' + esc(s.mealHoursDefault) + '"></div>'
    + '<div class="field"><label for="aj-stale">Avisar si un cronómetro lleva más de (horas)</label><input type="number" id="aj-stale" min="1" max="48" step="1" value="' + esc(s.staleTrackerAlertHours) + '"></div>'
    + '<div class="field"><button class="btn" id="aj-guardar">Guardar preferencias</button></div>'
    + '</div>'
    + '<div class="row" style="margin-top:12px"><div class="field grow">'
    + '<label><input type="checkbox" id="aj-autopip"' + (s.autoVentanaFlotante ? ' checked' : '') + '> '
    + 'Sacar el cronómetro a una ventana aparte al ponerlo en marcha</label>'
    + '<span class="hint">' + (pipDisponible()
        ? 'La ventana se abre sola al arrancar un cronómetro y se queda encima de todo el resto del tiempo, aunque cambies de pestaña o minimices. '
          + 'En la pantalla de Cronómetros se reduce a una pastillita con el tiempo, para no repetir la lista que ya está ahí.'
        : 'Tu navegador no puede abrir esa ventana. Funciona en Chrome y Edge (versión 116 o más nueva).')
    + '</span></div></div>'
    + '<p class="hint">Con estos valores, cada día tiene ' + esc(fmtDur(Math.max(0, (24 - num(s.sleepHoursDefault,0) - num(s.mealHoursDefault,0)) * 60))) + ' disponibles. '
    + 'Cambiarlos <strong>solo afecta a los días que vienen</strong>: los días ya registrados se quedan como estaban.</p>'
    + msgHtml('ajustes') + '</div>';

  /* Días cuyo sueño o comida se apartó del valor por defecto. Ya no se leen de
     una lista de excepciones aparte: se deducen de los registros reales, que
     son la única fuente de verdad desde CR-02. */
  const f = ui.ovFilter;
  const porDefecto = { sueno: num(s.sleepHoursDefault, 7), comida: num(s.mealHoursDefault, 3) };
  const diasConFijos = {};
  state.entries.filter(esEntradaFija).forEach(e => {
    const d = dayKeyOf(toZoned(Date.parse(e.inicio)));
    const tipo = e.projectId === FIJO_POR_TIPO.sueno.id ? 'sueno' : 'comida';
    if(!diasConFijos[d]) diasConFijos[d] = { sueno:0, comida:0 };
    diasConFijos[d][tipo] += e.duracionMin / 60;
  });
  const lista = [];
  Object.keys(diasConFijos).forEach(d => {
    ['sueno','comida'].forEach(tipo => {
      const h = diasConFijos[d][tipo];
      if(Math.abs(h - porDefecto[tipo]) < 0.001) return;
      if(isDayKey(f.desde) && d < f.desde) return;
      if(isDayKey(f.hasta) && d > f.hasta) return;
      lista.push({ fecha:d, tipo, horas: Math.round(h * 100) / 100 });
    });
  });
  lista.sort((a, b) => b.fecha.localeCompare(a.fecha) || a.tipo.localeCompare(b.tipo));

  html += '<div class="panel"><h2>Días fuera de lo habitual</h2>'
    + '<p class="hint">Sueño y comidas se registran solos todos los días. Aquí puedes corregir un día concreto — por ejemplo, si dormiste menos — sin tocar el resto.</p>'
    + '<div class="row">'
    + '<div class="field"><label for="ovn-fecha">Fecha</label><input type="date" id="ovn-fecha" value="' + esc(todayKey()) + '"></div>'
    + '<div class="field"><label for="ovn-tipo">Bloque</label><select id="ovn-tipo"><option value="sueno">Sueño</option><option value="comida">Comidas</option></select></div>'
    + '<div class="field"><label for="ovn-horas">Horas</label><input type="number" id="ovn-horas" min="0" max="24" step="0.5" value="6"></div>'
    + '<div class="field"><button class="btn" id="ovn-add">Ajustar ese día</button></div>'
    + '</div>'
    + '<div class="row" style="margin-top:10px">'
    + '<div class="field"><label for="ovf-desde">Desde</label><input type="date" id="ovf-desde" value="' + esc(f.desde) + '"></div>'
    + '<div class="field"><label for="ovf-hasta">Hasta</label><input type="date" id="ovf-hasta" value="' + esc(f.hasta) + '"></div>'
    + '<div class="field"><button class="btn ghost" id="ovf-limpiar">Limpiar filtro</button></div>'
    + '</div>';
  if(!lista.length){
    html += '<p class="empty">Ningún día se aparta de los valores por defecto en ese rango.</p>';
  }else{
    html += '<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Bloque</th><th class="num">Horas</th><th class="num">Por defecto</th><th>Acciones</th></tr></thead><tbody>';
    lista.forEach(o => {
      html += '<tr><td>' + esc(fmtDayShort(o.fecha)) + ' ' + esc(o.fecha.slice(0,4)) + '</td>'
        + '<td>' + (o.tipo === 'sueno' ? 'Sueño' : 'Comidas') + '</td>'
        + '<td class="num">' + esc(o.horas) + ' h</td>'
        + '<td class="num muted">' + esc(porDefecto[o.tipo]) + ' h</td>'
        + '<td><button class="btn ghost small" data-ovdel="' + esc(o.fecha + '|' + o.tipo) + '">Volver al valor por defecto</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  html += '<div class="panel"><h2>Tus datos</h2>'
    + '<p class="muted">' + state.projects.length + ' proyecto(s), ' + state.entries.length + ' registro(s) de tiempo, '
    + state.activeTrackers.length + ' cronómetro(s) en curso y ' + state.fixedBlockOverrides.length + ' excepción(es).</p>'
    + '<p class="hint">Todo se guarda en tu cuenta de LIPS-HUB y queda también en este navegador. El cálculo de sobrecarga se hace aquí mismo, sin enviar nada a ningún otro servicio.</p>'
    + '</div>';
  return html;
}

function wireAjustes(root){
  const guardar = root.querySelector('#aj-guardar');
  if(guardar) guardar.addEventListener('click', () => {
    const tz = root.querySelector('#aj-tz').value;
    const sueno = clamp(num(root.querySelector('#aj-sueno').value, 7), 0, 24);
    const comida = clamp(num(root.querySelector('#aj-comida').value, 3), 0, 24);
    const stale = clamp(Math.round(num(root.querySelector('#aj-stale').value, 6)), 1, 48);
    if(sueno + comida > 24){ setMsg('ajustes','Sueño y comida no pueden sumar más de 24 horas.','err'); render(); return; }
    state.settings.timezone = tz;
    state.settings.sleepHoursDefault = sueno;
    state.settings.mealHoursDefault = comida;
    state.settings.staleTrackerAlertHours = stale;
    const auto = root.querySelector('#aj-autopip');
    if(auto) state.settings.autoVentanaFlotante = auto.checked;
    tzWarned = false;
    save();
    setMsg('ajustes','Preferencias guardadas.','ok');
    say('Preferencias guardadas');
    render();
  });

  const add = root.querySelector('#ovn-add');
  if(add) add.addEventListener('click', () => {
    const fecha = root.querySelector('#ovn-fecha').value;
    const tipo = root.querySelector('#ovn-tipo').value;
    const horas = clamp(num(root.querySelector('#ovn-horas').value, 0), 0, 24);
    if(!isDayKey(fecha)){ setMsg('ajustes','Elige una fecha válida.','err'); render(); return; }
    const otro = tipo === 'sueno' ? 'comida' : 'sueno';
    if(horas + blockHours(fecha, otro) > 24){
      setMsg('ajustes','Sueño y comida de ese día no pueden sumar más de 24 horas.','err'); render(); return;
    }
    setHorasFijas(fecha, tipo, horas);
    save();
    setMsg('ajustes','Listo: ese día queda con ' + horas + ' h de ' + (tipo === 'sueno' ? 'sueño' : 'comidas') + '.','ok');
    say('Bloque fijo ajustado');
    render();
  });

  const bind = (id, key) => {
    const el = root.querySelector('#' + id);
    if(el) el.addEventListener('change', () => { ui.ovFilter[key] = el.value; renderInto('ajustes', true); });
  };
  bind('ovf-desde','desde'); bind('ovf-hasta','hasta');
  const limpiar = root.querySelector('#ovf-limpiar');
  if(limpiar) limpiar.addEventListener('click', () => { ui.ovFilter = { desde:'', hasta:'' }; render(); });

  root.querySelectorAll('[data-ovdel]').forEach(b => b.addEventListener('click', () => {
    const [fecha, tipo] = b.dataset.ovdel.split('|');
    state.fixedBlockOverrides = state.fixedBlockOverrides.filter(o => !(o.fecha === fecha && o.tipo === tipo));
    setHorasFijas(fecha, tipo, tipo === 'sueno' ? state.settings.sleepHoursDefault : state.settings.mealHoursDefault);
    save();
    setMsg('ajustes','Ese día vuelve al valor por defecto.','ok');
    render();
  }));
}

/* ───────────────────── render y navegación ───────────────────── */

const VIEWS = {
  panel:     { render:renderPanel,     wire:wirePanel },
  trackers:  { render:renderTrackers,  wire:wireTrackers },
  registros: { render:renderRegistros, wire:wireRegistros },
  proyectos: { render:renderProyectos, wire:wireProyectos },
  ajustes:   { render:renderAjustes,   wire:wireAjustes }
};

// `keepFocus` re-dibuja conservando el elemento que tenía el foco y su
// posición del cursor: sin eso, escribir en un filtro de texto lo perdería
// tras la primera letra.
function renderInto(view, keepFocus){
  const root = document.getElementById('view-' + view);
  if(!root) return;
  const act = document.activeElement;
  const focusId = keepFocus && act && act.id ? act.id : null;
  const selStart = focusId && act.setSelectionRange ? act.selectionStart : null;
  const selEnd = focusId && act.setSelectionRange ? act.selectionEnd : null;

  root.innerHTML = VIEWS[view].render();
  VIEWS[view].wire(root);

  if(focusId){
    const again = document.getElementById(focusId);
    if(again){
      again.focus();
      if(selStart != null && again.setSelectionRange){
        try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function render(){
  renderInto(ui.view, false);
  renderRunningChip();
  renderFloatPanel();
}

function renderRunningChip(){
  const el = document.getElementById('running-chip');
  const n = state.activeTrackers.length;
  if(!n){ el.innerHTML = ''; return; }
  const nowMs = Date.now();
  const total = state.activeTrackers.reduce((a, t) => a + trackerElapsed(t, nowMs), 0);
  el.innerHTML = '<span class="running-chip"><span class="dot" aria-hidden="true"></span>'
    + n + (n === 1 ? ' cronómetro' : ' cronómetros') + ' en curso · <span data-chip-total>' + fmtClock(total) + '</span></span>';
}

function switchView(view){
  if(!VIEWS[view]) return;
  ui.view = view;
  document.querySelectorAll('[role="tab"]').forEach(t => {
    const on = t.dataset.view === view;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
    document.getElementById('view-' + t.dataset.view).hidden = !on;
  });
  render();
  /* Cambiar de vista es un clic, y un clic es el permiso que el navegador
     exige para abrir la ventana flotante. Por eso se decide aquí: al salir de
     Cronómetros se abre, y al volver se cierra. */
  ajustarVentanaSegunVista();
}

document.querySelectorAll('[role="tab"]').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
  tab.addEventListener('keydown', (e) => {
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const i = tabs.indexOf(tab);
    let next = null;
    if(e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
    else if(e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
    else if(e.key === 'Home') next = tabs[0];
    else if(e.key === 'End') next = tabs[tabs.length - 1];
    if(next){ e.preventDefault(); next.focus(); switchView(next.dataset.view); }
  });
});

/* ───────────────────── panel flotante de cronómetros (CR-01) ─────────────────────
   Se ve en cualquier pestaña de la app mientras haya algo corriendo, se
   arrastra a donde sea, se minimiza a una pastilla, y deja pausar, reanudar y
   detener sin volver a la pantalla de Cronómetros.

   Una página web NO puede dibujar fuera de su pestaña: por eso este panel, por
   mucho que se arrastre, nunca sale del área de la página, y desaparece al
   cambiar de pestaña o minimizar. Eso no se arregla con CSS, es un límite del
   navegador.

   Para lo que hace falta de verdad —ver el cronómetro por encima de cualquier
   otro programa— está el botón "Ventana aparte", que usa Picture-in-Picture de
   documento: una ventana de verdad del sistema, siempre encima, que se mueve
   por toda la pantalla y sobrevive a cambiar de pestaña y a minimizar el
   navegador. Solo existe en Chrome y Edge (116+); donde no está, el botón lo
   explica en vez de fallar.

   El título de la pestaña sigue llevando el tiempo como tercer aviso, para
   quien no abra la ventana aparte. */

// La posición y el estado minimizado son preferencias de pantalla, no datos:
// van en su propia clave de localStorage y NO se sincronizan con la nube ni
// con el puente de carpeta (que solo mira las claves con prefijo hourglass_v1).
const FLOAT_PREF_KEY = 'hourglass_float_panel';
const TITULO_BASE = document.title;
const fp = { x:null, y:null, min:false, dragging:false };

/* Aislada por usuario como el resto de la caché, aunque sea solo una posición:
   mantener el mismo patrón `scopedKey` en todo evita tener que razonar caso
   por caso sobre qué se puede compartir entre cuentas del mismo navegador. */
function floatPrefKey(){ return scopedKey(FLOAT_PREF_KEY, cachedUserId); }

function loadFloatPref(){
  try{
    const raw = localStorage.getItem(floatPrefKey());
    if(!raw) return;
    const p = JSON.parse(raw);
    /* Solo números finitos de verdad. Ojo con `isFinite` a secas: convierte
       antes de comprobar, así que `isFinite(null)` es `true` y un `y:null`
       manipulado entraba como 0, pegando el panel al borde de arriba. */
    if(typeof p.x === 'number' && isFinite(p.x)) fp.x = p.x;
    if(typeof p.y === 'number' && isFinite(p.y)) fp.y = p.y;
    fp.min = !!p.min;
  }catch(e){ /* preferencia ilegible: se usa la posición por defecto */ }
}
function saveFloatPref(){
  try{
    localStorage.setItem(floatPrefKey(), JSON.stringify({ x:fp.x, y:fp.y, min:fp.min }));
  }catch(e){}
}

/* Franja de arriba que el panel no puede invadir: la cabecera y la barra de
   pestañas. Medido en móvil, el panel arrastrado hacia arriba se ponía encima
   de las pestañas y se las comía — un toque en la pestaña aterrizaba en el
   panel, no en el control de abajo. Se reserva su alto aunque la página esté
   desplazada, para que el panel no salte de sitio al hacer scroll. */
function limiteSuperiorFlotante(){
  const cab = document.querySelector('header.app');
  const nav = document.querySelector('nav.tabs');
  const alto = (cab ? cab.offsetHeight : 0) + (nav ? nav.offsetHeight : 0);
  return Math.max(6, alto + 6);
}

// Mantiene el panel dentro de la ventana: sin esto, al achicar la ventana
// podía quedar fuera de la pantalla sin forma de recuperarlo.
function clampFloat(x, y, el){
  const w = el ? el.offsetWidth : 310;
  const h = el ? el.offsetHeight : 120;
  const maxY = Math.max(6, window.innerHeight - h - 6);
  // En una pantalla muy baja la franja reservada podría no dejar sitio: ahí
  // manda caber en la ventana, que es lo irrecuperable.
  const minY = Math.min(limiteSuperiorFlotante(), maxY);
  return {
    x: clamp(x, 6, Math.max(6, window.innerWidth - w - 6)),
    y: clamp(y, minY, maxY)
  };
}

/* ── Ventana aparte (Picture-in-Picture de documento) ──
   Es la única forma que tiene una página web de poner algo encima del resto
   del escritorio. La ventana la dibuja el navegador, no la página: se queda
   por encima de todo, se mueve por toda la pantalla y sigue ahí aunque la
   pestaña de Hourglass pase a segundo plano o el navegador se minimice.
   Se cierra si se cierra la pestaña que la abrió. */
let pipWin = null;
/* Guarda contra el doble clic. `pipActivo()` no sirve para esto: mientras la
   primera petición sigue pendiente, `pipWin` todavía es null y da `false`, así
   que un segundo clic abría UNA SEGUNDA ventana. `pipWin` se quedaba apuntando
   solo a la última, la primera quedaba huérfana, y cerrar la huérfana anulaba
   la referencia a la que seguía abierta — con lo que su botón "Devolver a la
   página" terminaba cerrando la ventana equivocada. */
let abriendoPip = false;

function pipDisponible(){
  return !!(window.documentPictureInPicture && window.documentPictureInPicture.requestWindow);
}
function pipActivo(){ return !!(pipWin && !pipWin.closed); }

// El tiempo en vivo se refresca en la página y en la ventana aparte a la vez.
function docsConPanel(){
  return pipActivo() ? [document, pipWin.document] : [document];
}

/* `silencioso` es para las aperturas automáticas: si el navegador dice que no,
   no tiene sentido soltarle un error a alguien que no pidió nada. Los errores
   sí se muestran cuando fue ella quien pulsó el botón. */
async function abrirVentanaFlotante(opts){
  const silencioso = !!(opts && opts.silencioso);
  if(!pipDisponible()){
    if(!silencioso){
      setMsg('trackers','Tu navegador no puede abrir la ventana aparte. Funciona en Chrome y Edge (versión 116 o más nueva).','err');
      render();
    }
    return;
  }
  if(pipActivo()){ pipWin.focus(); return; }
  if(abriendoPip) return; // ya hay una petición en vuelo
  abriendoPip = true;
  const boton = document.querySelector('[data-fp="pip"]');
  if(boton) boton.disabled = true;
  try{
    /* Se le pide de entrada el tamaño que le va a tocar (pastilla o lista
       completa) para no abrirla grande y encogerla de inmediato: ese salto
       se notaba como un parpadeo. */
    const colapsadaAlNacer = state.activeTrackers.length > 0 && enVistaDeCronometros();
    const alto = colapsadaAlNacer ? 64 : Math.min(460, 130 + state.activeTrackers.length * 108);
    const w = await window.documentPictureInPicture.requestWindow({ width: 300, height: alto });
    /* Si mientras se esperaba llegó a abrirse otra por otra vía, esta sobra:
       se cierra en vez de dejarla huérfana sin nadie que la controle. */
    if(pipActivo()){ w.close(); return; }
    /* Ya no se cierra por estar en la vista de Cronómetros: ahí se queda,
       pero colapsada a una pastilla (pintarPip se encarga según la vista en
       el momento de pintar, no en el momento de pedir la ventana). Solo se
       descarta si para cuando llega ya no queda ningún cronómetro corriendo. */
    if(!state.activeTrackers.length){ w.close(); return; }
    pipWin = w;
  }catch(e){
    console.warn('[Hourglass] No se pudo abrir la ventana aparte:', e);
    /* Los dos motivos reales son distintos y llevan a soluciones distintas:
       `NotAllowedError` es "el navegador exige que esto salga de un clic tuyo"
       (pasa si algo lo dispara solo, o si el permiso está bloqueado);
       `InvalidStateError` es "ya hay otra ventana de estas abierta". Decir
       siempre lo segundo mandaba a buscar una ventana que no existía. */
    if(!silencioso){
      setMsg('trackers', e && e.name === 'InvalidStateError'
        ? 'Ya tienes otra ventana flotante abierta en el navegador. Ciérrala y vuelve a intentarlo.'
        : 'El navegador no dejó abrir la ventana aparte. Tiene que abrirse con un clic tuyo en este botón; si acabas de hacerlo, revisa que no esté bloqueada en los permisos del sitio.',
        'err');
      render();
    }
    return;
  }finally{
    abriendoPip = false;
    const b = document.querySelector('[data-fp="pip"]');
    if(b) b.disabled = false;
  }

  // La ventana nace vacía: hay que llevarle los estilos de la app.
  Array.prototype.forEach.call(document.styleSheets, (ss) => {
    try{
      const css = Array.prototype.map.call(ss.cssRules, (r) => r.cssText).join('\n');
      const el = pipWin.document.createElement('style');
      el.textContent = css;
      pipWin.document.head.appendChild(el);
    }catch(e){ /* hoja inaccesible (otro origen): se ignora */ }
  });
  pipWin.document.documentElement.lang = 'es';
  pipWin.document.body.className = 'pip-body';

  /* `pagehide` se dispara con CUALQUIER cierre nativo de la ventana: la X del
     marco, y también el ícono de "volver a la pestaña" que dibuja el propio
     navegador junto a la X (confirmado en vivo: la usuaria lo usó para
     asomarse a la pestaña, no para decir "ya no quiero esto"). No hay forma
     de distinguir cuál de los dos se usó — ninguno de los dos es un botón
     nuestro, son parte del marco que dibuja el sistema operativo/navegador,
     no de `pipWin.document`. Por eso NO se marca como cierre a mano aquí:
     eso queda reservado para el "×"/"Devolver a la página" de dentro de la
     propia app (`cerrarVentanaFlotante({manual:true})`), que sí son una
     decisión inequívoca. Un cierre nativo solo se rearma para el próximo
     gesto — igual que al recargar con un cronómetro ya corriendo — así que
     basta con que la usuaria toque cualquier cosa en la página para que
     vuelva a aparecer sola, sin tener que arrancar un cronómetro nuevo.

     El `if` de abajo distingue quién cerró. `pagehide` también se dispara
     cuando la cierra el propio código (al detenerse el último cronómetro),
     y sin esa comprobación esos cierres automáticos activarían el rearme de
     abajo sin necesidad. Quien cierra por código pone `pipWin` en null
     antes, así que si al llegar aquí ya no apunta a esta ventana, no fue un
     cierre nativo. */
  const estaVentana = pipWin;
  pipWin.addEventListener('pagehide', () => {
    if(pipWin !== estaVentana) return;
    pipWin = null;
    render();
    armarAperturaEnPrimerGesto();
    say('El cronómetro volvió a la página');
  });

  render();
  say('Cronómetro abierto en una ventana aparte');
}

/* Si la usuaria la cierra ella misma, no se le vuelve a abrir sola en cuanto
   cambia de vista o de pestaña: eso sería discutirle una decisión que acaba
   de tomar. La apertura automática se rearma al arrancar el próximo
   cronómetro (ver el clic de "Iniciar" en wireTrackers), que es el punto
   natural donde el ciclo empieza de nuevo. */
let pipCerradaAMano = false;

function cerrarVentanaFlotante(opts){
  if(opts && opts.manual) pipCerradaAMano = true;
  // La referencia se suelta ANTES de cerrar: es lo que le dice al manejador de
  // `pagehide` que este cierre lo pidió el código y no la usuaria.
  const w = pipWin;
  pipWin = null;
  if(w && !w.closed) w.close();
  /* Se redibuja aquí mismo y no se espera al `pagehide` de la ventana: ese
     evento avisa cuando la cierra la usuaria con la X, pero cerrándola desde
     el código el recordatorio de la página se quedaba puesto, señalando a una
     ventana que ya no existe. */
  renderFloatPanel();
}

/* Abre la ventana sola si la preferencia está puesta. Se llama desde dentro de
   un clic real (arrancar un cronómetro), que es lo único que el navegador
   acepta como permiso para abrirla. */
function abrirVentanaSiCorresponde(){
  if(!state.settings.autoVentanaFlotante) return;
  if(pipCerradaAMano) return; // la cerró ella; no insistir hasta que arranque otro cronómetro
  if(!pipDisponible() || pipActivo() || abriendoPip) return;
  if(!state.activeTrackers.length) return;
  /* Ya no se salta la apertura por estar en la vista de Cronómetros: ese
     salto era justo el hueco que dejaba la ventana sin abrir cuando la
     usuaria arrancaba el cronómetro ahí mismo y se iba derecho a otra
     pestaña, sin ningún otro clic del que colgarse. Nace colapsada a una
     pastilla en ese caso (ver enVistaDeCronometros/pintarPip). */
  abrirVentanaFlotante({ silencioso:true });
}

/* Decide si la ventana aparte debe verse como una pastilla chiquita (solo el
   tiempo total) o como la lista completa. Mirando la lista de Cronómetros no
   hace falta repetirla flotando encima — pero, a diferencia de antes, la
   ventana ya no se cierra ahí: se queda abierta y lista, solo que reducida,
   para no depender de ningún clic adicional cuando la usuaria se vaya. */
function enVistaDeCronometros(){
  return ui.view === 'trackers' && document.visibilityState === 'visible';
}

function ajustarVentanaSegunVista(){
  if(!state.settings.autoVentanaFlotante) return;
  if(pipActivo()){ pintarPip(); return; } // solo hace falta repintar (pastilla ↔ lista)
  abrirVentanaSiCorresponde();
}

/* Se llama en los dos sentidos (pestaña que se oculta y que vuelve): repintar
   una ventana ya abierta no necesita gesto, solo abrirla lo necesita. Por eso
   `ajustarVentanaSegunVista` no distingue dirección — si ya está abierta,
   repinta; si no, intenta abrirla (y si la pestaña está oculta, esa apertura
   fallará silenciosa, sin gesto real detrás; no pasa nada, es solo un intento
   de más). */
document.addEventListener('visibilitychange', () => {
  ajustarVentanaSegunVista();
});

/* Se usa en dos momentos: al cargar la página con un cronómetro ya corriendo
   (ahí no hay ningún gesto del que colgarse), y tras un cierre nativo de la
   ventana aparte (X o el ícono de "volver a la pestaña" del propio
   navegador, ver el `pagehide` de `abrirVentanaFlotante`) — en ambos casos
   se espera al primer clic o tecla que llegue, en cualquier parte de la
   página, y se abre entonces. `gestoArmado` evita apilar dos escuchas si se
   llama dos veces seguidas sin que ninguna haya disparado todavía. */
let gestoArmado = false;
function armarAperturaEnPrimerGesto(){
  if(!state.settings.autoVentanaFlotante) return;
  if(!pipDisponible() || pipActivo()) return;
  if(!state.activeTrackers.length) return;
  if(gestoArmado) return;
  gestoArmado = true;
  const alGesto = () => {
    gestoArmado = false;
    document.removeEventListener('pointerdown', alGesto, true);
    document.removeEventListener('keydown', alGesto, true);
    abrirVentanaSiCorresponde();
  };
  document.addEventListener('pointerdown', alGesto, true);
  document.addEventListener('keydown', alGesto, true);
}

// Lista de cronómetros, igual en la página y en la ventana aparte.
function fpListaHtml(nowMs){
  let html = '<div class="fp-body">';
  state.activeTrackers.forEach(t => {
    const p = projectById(t.projectId);
    const pausado = isPaused(t);
    html += '<div class="fp-item' + (pausado ? ' paused' : '') + '">'
      + '<div class="fp-proj">' + projectChip(p) + '</div>'
      + '<div class="fp-sec">' + esc(p ? sectionById(p.sectionId).nombre : 'Sin sección')
      + (pausado ? ' · en pausa' : '') + '</div>'
      + '<div class="fp-time" data-elapsed="' + esc(t.id) + '">' + fmtClock(trackerElapsed(t, nowMs)) + '</div>'
      + '<div class="fp-acts">'
      + (pausado
          ? '<button class="fp-act" data-act="resume" data-id="' + esc(t.id) + '">▶ Reanudar</button>'
          : '<button class="fp-act" data-act="pause" data-id="' + esc(t.id) + '">⏸ Pausar</button>')
      + '<button class="fp-act stop" data-act="stop" data-id="' + esc(t.id) + '">⏹ Detener</button>'
      + '</div></div>';
  });
  return html + '</div>';
}

/* Contenido de la ventana aparte. No lleva asa de arrastre ni botón de
   minimizar: de mover y redimensionar se encarga la ventana del sistema.
   Se llama tanto al abrirla como cada vez que cambia la vista o la
   visibilidad de la pestaña, para alternar entre pastilla y lista completa
   sin tener que cerrar y volver a abrir la ventana (que sí exigiría un
   gesto nuevo cada vez). */
function pintarPip(){
  if(!pipActivo()) return;
  const nowMs = Date.now();
  const n = state.activeTrackers.length;
  const total = state.activeTrackers.reduce((a, t) => a + trackerElapsed(t, nowMs), 0);
  const colapsado = n > 0 && enVistaDeCronometros();

  /* Se reconstruye TODO el body en cada llamada, y ya no solo al cambiar de
     vista: la ventana ahora se queda abierta indefinidamente, así que quien
     esté enfocando un botón con el teclado dentro de ella (p. ej. el "×" de
     la pastilla) puede perder el foco en silencio en cualquier `render()` de
     la página principal. Se guarda qué estaba enfocado por sus atributos
     `data-*` (los nodos se destruyen, no sirve guardar la referencia) y se
     intenta reenfocar el equivalente tras reconstruir. */
  const activoAntes = pipWin.document.activeElement;
  const foco = (activoAntes && activoAntes !== pipWin.document.body)
    ? { fp: activoAntes.dataset.fp, act: activoAntes.dataset.act, id: activoAntes.dataset.id }
    : null;

  let html;
  if(colapsado){
    // Mirando la lista de Cronómetros: solo una pastillita con el total, para
    // no repetir encima la misma lista que ya está en la página.
    html = '<div id="float-panel" class="pip pip-mini" role="complementary" aria-label="' + esc(n === 1 ? 'Cronómetro en curso' : n + ' cronómetros en curso') + '">'
      + '<div class="fp-pill">'
      + '<span class="dot" aria-hidden="true"></span>'
      + '<span class="fp-total" data-fp-total>' + fmtClock(total) + '</span>'
      + '<button class="fp-mini-close" data-fp="cerrar-pip" aria-label="Cerrar la ventana aparte">×</button>'
      + '</div></div>';
  }else{
    html = '<div id="float-panel" class="pip" role="complementary" aria-label="Cronómetros en curso">'
      + '<div class="fp-head">'
      + '<span class="fp-grip" style="cursor:default">'
      + '<span class="fp-title">' + n + (n === 1 ? ' cronómetro' : ' cronómetros') + '</span>'
      + '<span class="fp-total" data-fp-total>' + fmtClock(total) + '</span></span>'
      + '</div>';
    html += n ? fpListaHtml(nowMs)
              : '<div class="fp-body"><div class="fp-item"><div class="fp-sec">Nada corriendo ahora mismo</div></div></div>';
    html += '<div class="fp-foot"><button data-fp="cerrar-pip">Devolver a la página</button></div></div>';
  }
  pipWin.document.body.innerHTML = html;

  const panel = pipWin.document.getElementById('float-panel');
  panel.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', () => trackerAction(b.dataset.act, b.dataset.id));
  });
  const cerrarBtn = panel.querySelector('[data-fp="cerrar-pip"]');
  if(cerrarBtn) cerrarBtn.addEventListener('click', () => cerrarVentanaFlotante({ manual:true }));

  if(foco){
    let el = null;
    if(foco.fp) el = panel.querySelector('[data-fp="' + foco.fp + '"]');
    else if(foco.act) el = panel.querySelector('[data-act="' + foco.act + '"][data-id="' + CSS.escape(foco.id || '') + '"]');
    if(el) el.focus();
  }

  // El alto se ajusta al pasar de pastilla a lista y viceversa; sin esto se
  // quedaba con el tamaño con el que nació la ventana.
  if(typeof pipWin.resizeTo === 'function'){
    try{ pipWin.resizeTo(300, colapsado ? 64 : Math.min(460, 130 + n * 108)); }
    catch(e){ /* algún navegador puede negarlo; no es crítico */ }
  }
}

function renderFloatPanel(){
  const host = document.getElementById('float-host');
  const n = state.activeTrackers.length;

  /* Sin nada corriendo, la ventana aparte no tiene función: se cierra sola en
     vez de quedarse flotando encima del escritorio diciendo "nada corriendo".
     No cuenta como cierre manual — el ciclo automático sigue vivo. */
  if(pipActivo() && !n){
    const w = pipWin;
    pipWin = null;          // igual que arriba: marca que el cierre es del código
    if(!w.closed) w.close();
  }

  /* En la vista de Cronómetros el panel de la PÁGINA no se dibuja: sería
     repetir encima la misma lista que ya ocupa la pantalla. El título de la
     pestaña sí sigue llevando el tiempo. Si la ventana aparte ya está
     abierta, se queda abierta pero colapsada a una pastilla (pintarPip) en
     vez de cerrarse — así sigue lista sin que haga falta ningún clic más
     cuando la usuaria se vaya de esta vista o de la pestaña. */
  if(n && enVistaDeCronometros()){
    host.innerHTML = '';
    document.title = '⏳ ' + fmtClock(state.activeTrackers.reduce((a, t) => a + trackerElapsed(t, Date.now()), 0)) + ' · Hourglass';
    if(pipActivo()) pintarPip();
    return;
  }

  if(pipActivo()){
    // Con la ventana aparte abierta, en la página solo queda un recordatorio
    // de dónde está el cronómetro, para no tener lo mismo dos veces.
    host.innerHTML = '<div id="float-panel" role="complementary" aria-label="Cronómetros en curso">'
      + '<div class="fp-head"><span class="fp-grip" tabindex="0" role="button"'
      + ' aria-describedby="fp-drag-help" title="Arrastra para mover.">'
      + '<span class="fp-dots" aria-hidden="true">⠿</span>'
      + '<span class="fp-title">⧉ En ventana aparte</span></span></div>'
      + '<div class="fp-foot"><button data-fp="volver-pip">Devolver a la página</button></div></div>'
      + '<span id="fp-drag-help" class="sr-only">Arrastra este panel con el ratón, o muévelo con las flechas del teclado.</span>';
    const marcador = document.getElementById('float-panel');
    const pos = clampFloat(fp.x === null ? 16 : fp.x, fp.y === null ? window.innerHeight - 90 : fp.y, marcador);
    fp.x = pos.x; fp.y = pos.y;
    marcador.style.left = fp.x + 'px';
    marcador.style.top = fp.y + 'px';
    wireFloatPanel(marcador);
    marcador.querySelector('[data-fp="volver-pip"]').addEventListener('click', () => cerrarVentanaFlotante({ manual:true }));
    pintarPip();
    document.title = n ? ('⏳ ' + fmtClock(state.activeTrackers.reduce((a, t) => a + trackerElapsed(t, Date.now()), 0)) + ' · Hourglass') : TITULO_BASE;
    return;
  }

  if(!n){
    host.innerHTML = '';
    document.title = TITULO_BASE;
    return;
  }
  if(fp.dragging) return; // no reconstruir el nodo que se está arrastrando

  const nowMs = Date.now();
  const total = state.activeTrackers.reduce((a, t) => a + trackerElapsed(t, nowMs), 0);
  const enPausa = state.activeTrackers.filter(isPaused).length;

  let html = '<div id="float-panel" class="' + (fp.min ? 'min' : '') + '" role="complementary" aria-label="Cronómetros en curso">'
    + '<div class="fp-head">'
    + '<span class="fp-grip" tabindex="0" role="button" aria-describedby="fp-drag-help"'
    + ' title="Arrastra para mover. Con el teclado: flechas para moverlo, Inicio para devolverlo a su sitio.">'
    + '<span class="fp-dots" aria-hidden="true">⠿</span>';

  if(fp.min){
    html += '<span class="fp-pill"><span class="dot" aria-hidden="true"></span>'
      + '<span class="fp-total" data-fp-total>' + fmtClock(total) + '</span></span>';
  }else{
    html += '<span class="fp-title">' + n + (n === 1 ? ' cronómetro' : ' cronómetros') + '</span>'
      + '<span class="fp-total" data-fp-total>' + fmtClock(total) + '</span>';
  }
  html += '</span>'
    + (pipDisponible()
        ? '<button class="fp-btn" data-fp="pip" title="Sacar a una ventana aparte, siempre encima de todo"'
          + ' aria-label="Sacar el cronómetro a una ventana aparte, siempre visible encima de otros programas">⧉</button>'
        : '')
    + '<button class="fp-btn" data-fp="toggle" aria-expanded="' + (fp.min ? 'false' : 'true') + '"'
    + ' aria-label="' + (fp.min ? 'Expandir el panel de cronómetros' : 'Minimizar el panel de cronómetros') + '">'
    + (fp.min ? '▣' : '—') + '</button>'
    + '</div>'
    + '<span id="fp-drag-help" class="sr-only">Arrastra este panel con el ratón, o muévelo con las flechas del teclado cuando esté enfocado. La tecla Inicio lo devuelve a su posición original.</span>';

  if(!fp.min){
    html += fpListaHtml(nowMs)
      + '<div class="fp-foot"><button data-fp="ir">Ver todo en Cronómetros →</button></div>';
  }
  html += '</div>';
  host.innerHTML = html;

  const panel = document.getElementById('float-panel');
  // Posición por defecto: abajo a la izquierda, lejos del widget de cuenta y
  // de la insignia de carpeta, que viven abajo a la derecha.
  if(fp.x === null || fp.y === null){
    fp.x = 16;
    fp.y = Math.max(16, window.innerHeight - panel.offsetHeight - 16);
  }
  const pos = clampFloat(fp.x, fp.y, panel);
  fp.x = pos.x; fp.y = pos.y;
  panel.style.left = fp.x + 'px';
  panel.style.top = fp.y + 'px';

  wireFloatPanel(panel);
  // Aviso pasivo también en el título de la pestaña, para cuando la app no
  // está a la vista (CR-01 §3.3 deja fuera las notificaciones del sistema).
  document.title = '⏳ ' + fmtClock(total) + (enPausa === n ? ' (en pausa)' : '') + ' · Hourglass';
}

function wireFloatPanel(panel){
  const grip = panel.querySelector('.fp-grip');

  // Arrastre con puntero: sirve igual para ratón, lápiz y dedo.
  grip.addEventListener('pointerdown', (e) => {
    if(e.button !== undefined && e.button !== 0) return;
    const r = panel.getBoundingClientRect();
    const dx = e.clientX - r.left;
    const dy = e.clientY - r.top;
    fp.dragging = true;
    grip.setPointerCapture(e.pointerId);

    const move = (ev) => {
      const pos = clampFloat(ev.clientX - dx, ev.clientY - dy, panel);
      fp.x = pos.x; fp.y = pos.y;
      panel.style.left = fp.x + 'px';
      panel.style.top = fp.y + 'px';
    };
    const up = () => {
      fp.dragging = false;
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', up);
      grip.removeEventListener('pointercancel', up);
      saveFloatPref();
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
    e.preventDefault();
  });

  // Mismo movimiento con teclado: arrastrar con el ratón no puede ser la
  // única forma de recolocarlo.
  grip.addEventListener('keydown', (e) => {
    // Inicio devuelve el panel a su sitio de siempre: la posición se recuerda
    // entre sesiones, así que si queda tapando un control hace falta una forma
    // de recuperarlo sin arrastrarlo a ciegas.
    if(e.key === 'Home'){
      e.preventDefault();
      const inicio = clampFloat(16, window.innerHeight - panel.offsetHeight - 16, panel);
      fp.x = inicio.x; fp.y = inicio.y;
      panel.style.left = fp.x + 'px';
      panel.style.top = fp.y + 'px';
      saveFloatPref();
      say('Panel de cronómetros devuelto a su posición inicial');
      return;
    }
    const paso = e.shiftKey ? 40 : 12;
    let dx = 0, dy = 0;
    if(e.key === 'ArrowLeft') dx = -paso;
    else if(e.key === 'ArrowRight') dx = paso;
    else if(e.key === 'ArrowUp') dy = -paso;
    else if(e.key === 'ArrowDown') dy = paso;
    else return;
    e.preventDefault();
    const pos = clampFloat(fp.x + dx, fp.y + dy, panel);
    fp.x = pos.x; fp.y = pos.y;
    panel.style.left = fp.x + 'px';
    panel.style.top = fp.y + 'px';
    saveFloatPref();
  });

  /* El recordatorio que queda en la página cuando el cronómetro está en la
     ventana aparte comparte esta función pero no trae botón de minimizar:
     por eso todos los controles de aquí abajo se buscan antes de engancharse. */
  const toggle = panel.querySelector('[data-fp="toggle"]');
  if(toggle) toggle.addEventListener('click', () => {
    fp.min = !fp.min;
    saveFloatPref();
    renderFloatPanel();
    const b = document.querySelector('#float-panel [data-fp="toggle"]');
    if(b) b.focus();
    say(fp.min ? 'Panel de cronómetros minimizado' : 'Panel de cronómetros expandido');
  });

  const ir = panel.querySelector('[data-fp="ir"]');
  if(ir) ir.addEventListener('click', () => {
    switchView('trackers');
    const tab = document.getElementById('tab-trackers');
    if(tab) tab.focus();
  });

  // Tiene que salir de un clic: el navegador no deja abrir esta ventana desde
  // código suelto.
  const pip = panel.querySelector('[data-fp="pip"]');
  if(pip) pip.addEventListener('click', abrirVentanaFlotante);

  // trackerAction ya llama a render(), que redibuja también este panel.
  panel.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', () => trackerAction(b.dataset.act, b.dataset.id));
  });
}

// Al achicar la ventana, el panel podría quedar fuera de la pantalla.
window.addEventListener('resize', () => {
  const panel = document.getElementById('float-panel');
  if(!panel || fp.x === null) return;
  const pos = clampFloat(fp.x, fp.y, panel);
  fp.x = pos.x; fp.y = pos.y;
  panel.style.left = fp.x + 'px';
  panel.style.top = fp.y + 'px';
});

/* ───────────────────── aviso de cronómetro olvidado ─────────────────────
   Pop-up centrado, no un banner: decisión 5 cerrada con la usuaria, tomada
   a propósito en contra de la recomendación de algo menos invasivo, porque
   la prioridad es que no pase desapercibido. */
let modalPrevFocus = null;

function staleTrackers(){
  const nowMs = Date.now();
  const limite = staleMs();
  return state.activeTrackers.filter(t => (nowMs - Date.parse(t.startedAt)) > limite);
}

/* El aviso vive en la página, pero los cronómetros se pueden detener desde la
   ventana aparte, que es otro documento. Sin esto, el aviso se quedaba
   hablando de cronómetros que ya no existían, y su botón "Detener todos"
   respondía "0 cronómetro(s) detenido(s)". */
function refrescarAvisoStale(){
  const host = document.getElementById('modal-host');
  if(!host.children.length) return;
  if(!staleTrackers().length){
    closeModal();
    say('El aviso se cerró: ya no queda ningún cronómetro olvidado');
    return;
  }
  pintarAvisoStale();
}

function checkStaleTrackers(){
  if(!staleTrackers().length) return;
  modalPrevFocus = document.activeElement;
  lockBehindModal(document.getElementById('modal-host'));
  pintarAvisoStale();
  const primero = document.querySelector('#modal-host .modal button');
  if(primero) primero.focus();
}

// Dibuja (o vuelve a dibujar) el contenido del aviso con la lista al día.
// No toca el bloqueo del fondo ni el foco: de eso se encarga quien lo abre.
function pintarAvisoStale(){
  const viejos = staleTrackers();
  if(!viejos.length) return;
  const host = document.getElementById('modal-host');
  const horas = clamp(num(state.settings.staleTrackerAlertHours, 6), 1, 48);
  const nowMs = Date.now();

  host.innerHTML = '<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">'
    + '<h2 id="modal-title">⏳ Hay ' + (viejos.length === 1 ? 'un cronómetro' : viejos.length + ' cronómetros') + ' sin detener</h2>'
    + '<p id="modal-desc">Lleva' + (viejos.length === 1 ? '' : 'n') + ' más de ' + horas + ' horas corriendo. Confirma si el tiempo es real o corrígelo antes de que ensucie tus totales.</p>'
    + '<ul>' + viejos.map(t => '<li><strong>' + esc(projectName(t.projectId)) + '</strong> — '
        + esc(fmtClock(trackerElapsed(t, nowMs))) + ' desde ' + esc(fmtDayShort(dayKeyOf(toZoned(Date.parse(t.startedAt)))))
        + ' ' + esc(hhmmOf(toZoned(Date.parse(t.startedAt)))) + '</li>').join('') + '</ul>'
    + '<div class="actions">'
    + '<button class="btn" id="mo-stop">Detener ' + (viejos.length === 1 ? 'ahora' : 'todos ahora') + '</button>'
    + '<button class="btn ghost" id="mo-fix">Ir a corregir</button>'
    + '<button class="btn ghost" id="mo-later">Dejarlo corriendo</button>'
    + '</div></div></div>';

  const modal = host.querySelector('.modal');
  const focusables = () => Array.from(modal.querySelectorAll('button'));

  // Trampa de foco: mientras el aviso está abierto, el Tab no debe salirse a
  // la página de atrás.
  modal.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key !== 'Tab') return;
    const f = focusables();
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  host.querySelector('#mo-stop').addEventListener('click', () => {
    const iso = new Date().toISOString();
    let guardados = 0, vacios = 0;
    staleTrackers().forEach(t => { stopTracker(t, iso) ? guardados++ : vacios++; });
    closeModal();
    switchView('trackers');
    setMsg('trackers', vacios
      ? guardados + ' cronómetro(s) guardado(s) como registro. ' + vacios + ' se detuvo(eron) sin guardar nada, porque todo su tiempo estaba en pausa.'
      : guardados + ' cronómetro(s) detenido(s) y guardado(s) como registro.',
      vacios ? 'err' : 'ok');
    say('Cronómetros detenidos');
    render();
  });
  host.querySelector('#mo-fix').addEventListener('click', () => {
    closeModal();
    switchView('trackers');
    setMsg('trackers','Detén el cronómetro y luego ajusta el horario del registro en la pestaña Registros.','ok');
    render();
  });
  host.querySelector('#mo-later').addEventListener('click', closeModal);
}

/* La trampa de foco sola no basta: un lector de pantalla en modo de cursor
   virtual no navega con Tab, así que puede seguir "entrando" al contenido de
   atrás aunque el foco no salga del aviso. `inert` lo saca del árbol de
   accesibilidad, no solo del orden de tabulación — es lo mismo que hace el
   candado de auth-gate.js. Se recuerda qué se marcó para devolverlo como
   estaba (puede haber elementos ya inertes por el candado). */
let modalInerted = [];
function lockBehindModal(host){
  modalInerted = [];
  Array.prototype.forEach.call(document.body.children, (el) => {
    if(el === host || el.hasAttribute('inert')) return;
    el.setAttribute('inert', '');
    modalInerted.push(el);
  });
}
function unlockBehindModal(){
  modalInerted.forEach(el => el.removeAttribute('inert'));
  modalInerted = [];
}

function closeModal(){
  document.getElementById('modal-host').innerHTML = '';
  unlockBehindModal();
  if(modalPrevFocus && modalPrevFocus.focus) modalPrevFocus.focus();
  modalPrevFocus = null;
}

/* ───────────────────── arranque y latido ───────────────────── */

(async () => {
  await load();
  // Después de load(), que es quien resuelve cachedUserId: la preferencia del
  // panel va aislada por usuario y antes de eso no se sabe cuál es.
  loadFloatPref();
  cloudSyncReady = true;
  /* Los registros automáticos se ponen al día al abrir la app, pero solo con
     sesión confirmada. Sin ella, `cachedUserId` es null y guardar escribiría
     en la clave sin aislar por usuario — el mismo principio de "no guardar
     nada antes de confirmar quién eres" que ya sigue `load()`. */
  if(cachedUserId && generarFijosPendientes()) save();
  render();
  checkStaleTrackers();
  armarAperturaEnPrimerGesto();
})();

/* El cronómetro en pantalla se refresca cada segundo, pero NO se guarda cada
   segundo: los datos solo se escriben en start/pause/resume/stop. Así un
   cronómetro de varias horas no genera cientos de escrituras a Supabase. */
setInterval(() => {
  if(!state.activeTrackers.length) return;
  const nowMs = Date.now();
  const total = state.activeTrackers.reduce((a, t) => a + trackerElapsed(t, nowMs), 0);
  // Los mismos selectores en la página y en la ventana aparte, si está abierta.
  docsConPanel().forEach(doc => {
    doc.querySelectorAll('[data-elapsed]').forEach(el => {
      const t = state.activeTrackers.find(x => x.id === el.dataset.elapsed);
      if(t) el.textContent = fmtClock(trackerElapsed(t, nowMs));
    });
    doc.querySelectorAll('[data-fp-total]').forEach(el => { el.textContent = fmtClock(total); });
  });
  const chip = document.querySelector('[data-chip-total]');
  if(chip) chip.textContent = fmtClock(total);
  const enPausa = state.activeTrackers.filter(isPaused).length;
  document.title = '⏳ ' + fmtClock(total)
    + (enPausa === state.activeTrackers.length ? ' (en pausa)' : '') + ' · Hourglass';
}, 1000);

/* El panel sí depende del reloj (un cronómetro en curso mueve los totales),
   pero volver a dibujarlo cada segundo sería tirar el foco de quien esté
   usando un filtro. Se refresca cada minuto y solo si nadie está escribiendo. */
setInterval(() => {
  if(ui.view !== 'panel' || !state.activeTrackers.length) return;
  const a = document.activeElement;
  if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  if(document.getElementById('modal-host').children.length) return;
  render();
}, 60000);
</script>
