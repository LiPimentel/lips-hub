<!DOCTYPE html>
<html lang="es">
<head>
<script>
/* ===== AI APPs · Folder Bridge (guardado en carpeta local) ===== */
(function(){
  const APP_ID = "hourglass";
  const SYNC_PREFIX = "hourglass_v1";
  // La caché real se guarda como "hourglass_v1::<userId>" (aislada por usuario),
  // así que este puente reconoce cualquier clave con ese prefijo, no solo la exacta.
  function isSyncKey(k){ return k === SYNC_PREFIX || k.indexOf(SYNC_PREFIX + '::') === 0; }
  const DB_NAME = "aiapps-folder-bridge";
  const STORE = "handles";

  function idbOpen(){
    return new Promise((res, rej)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((res, rej)=>{
      const rq = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  async function idbSet(key, val){
    const db = await idbOpen();
    return new Promise((res, rej)=>{
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  const supported = 'showDirectoryPicker' in window;
  let dirHandle = null;
  let writeTimer = null;
  let badgeEl = null;
  const FILE_NAME = APP_ID + ".data.json";

  async function readFolderFile(){
    if(!dirHandle) return null;
    try{
      const fh = await dirHandle.getFileHandle(FILE_NAME, {create:false});
      const file = await fh.getFile();
      const text = await file.text();
      return text ? JSON.parse(text) : null;
    }catch(e){ return null; }
  }

  async function writeFolderFile(data){
    if(!dirHandle) return;
    try{
      const fh = await dirHandle.getFileHandle(FILE_NAME, {create:true});
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify(data, null, 2));
      await writable.close();
    }catch(e){ console.warn("[AI APPs] No se pudo escribir en la carpeta:", e); }
  }

  function collectLocalSnapshot(){
    const out = {};
    Object.keys(localStorage).forEach(k => { if(isSyncKey(k)){ const v = localStorage.getItem(k); if(v !== null) out[k] = v; } });
    return out;
  }

  function applySnapshot(snap){
    if(!snap) return;
    Object.keys(snap).forEach(k => { if(isSyncKey(k)) localStorage.setItem.__original.call(localStorage, k, snap[k]); });
  }

  function queueWrite(){
    clearTimeout(writeTimer);
    writeTimer = setTimeout(()=>{ writeFolderFile(collectLocalSnapshot()); }, 700);
  }

  // Interceptar localStorage.setItem para reflejar cada cambio en el archivo de la carpeta
  const origSetItem = localStorage.setItem.bind(localStorage);
  function patchedSetItem(key, value){
    origSetItem(key, value);
    if(isSyncKey(key)) queueWrite();
  }
  patchedSetItem.__original = origSetItem;
  localStorage.setItem = patchedSetItem;

  function makeBadge(){
    const el = document.createElement('div');
    el.id = 'aiapps-folder-badge';
    el.style.cssText = 'position:fixed;bottom:calc(14px + min(var(--aiapps-chrome-bottom, 0px), 40vh));right:14px;z-index:999999;font-family:system-ui,-apple-system,sans-serif;font-size:12.5px;line-height:1;display:inline-flex;align-items:center;gap:7px;background:#1B2430;color:#F1EDE4;padding:9px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.12);user-select:none;';
    document.body.appendChild(el);
    return el;
  }

  function setBadge(state){
    if(!badgeEl) return;
    if(state === 'connected'){
      badgeEl.textContent = '📁 Guardando en carpeta local';
      badgeEl.style.opacity = '0.72';
      badgeEl.style.cursor = 'default';
      badgeEl.title = 'Los datos se están guardando en ' + FILE_NAME + ' dentro de tu carpeta AI APPs';
      badgeEl.onclick = null;
    } else if(state === 'reconnect'){
      badgeEl.textContent = '📁 Reconectar carpeta de datos';
      badgeEl.style.opacity = '1';
      badgeEl.style.cursor = 'pointer';
      badgeEl.onclick = connect;
    } else if(state === 'unsupported'){
      badgeEl.textContent = '⚠️ Guardado solo local (usa Chrome/Edge)';
      badgeEl.style.opacity = '0.6';
      badgeEl.style.cursor = 'default';
      badgeEl.onclick = null;
    } else {
      badgeEl.textContent = '📁 Conectar carpeta de datos';
      badgeEl.style.opacity = '1';
      badgeEl.style.cursor = 'pointer';
      badgeEl.onclick = connect;
    }
  }

  async function connect(){
    try{
      const handle = await window.showDirectoryPicker({ id: 'aiapps-folder', mode: 'readwrite' });
      const perm = await handle.requestPermission({ mode: 'readwrite' });
      if(perm !== 'granted') throw new Error('permiso denegado');
      dirHandle = handle;
      await idbSet(APP_ID + '-dir', handle);
      const existing = await readFolderFile();
      if(existing){
        applySnapshot(existing);
        setBadge('connected');
        location.reload();
        return;
      }
      await writeFolderFile(collectLocalSnapshot());
      setBadge('connected');
    }catch(e){
      console.warn('[AI APPs] Conexión de carpeta cancelada:', e);
    }
  }

  async function tryReconnect(){
    try{
      const handle = await idbGet(APP_ID + '-dir');
      if(!handle){ setBadge('idle'); return; }
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if(perm === 'granted'){
        dirHandle = handle;
        const existing = await readFolderFile();
        if(existing){
          const localSnap = JSON.stringify(collectLocalSnapshot());
          const fileSnap = JSON.stringify(existing);
          if(localSnap !== fileSnap){
            applySnapshot(existing);
            setBadge('connected');
            location.reload();
            return;
          }
        }
        setBadge('connected');
      } else {
        setBadge('reconnect');
      }
    }catch(e){
      setBadge('idle');
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    badgeEl = makeBadge();
    if(!supported){ setBadge('unsupported'); return; }
    setBadge('idle');
    await tryReconnect();
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hourglass — your time slice</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%230E1A1E'/%3E%3Ctext x='15' y='22' font-size='16' text-anchor='middle'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>window.AIAPPS_APP_ID = 'hourglass'; window.AIAPPS_SHOW_ACCOUNT_WIDGET = true; window.AIAPPS_APP_NAME = 'Hourglass'; window.AIAPPS_APP_EMOJI = '⏳'; window.AIAPPS_LOGO_HOURGLASS = true; window.AIAPPS_APP_TAGLINE = 'your time slice'; window.AIAPPS_APP_ACCENT = '#3FB8AE'; window.AIAPPS_APP_BG = '#0E1A1E'; window.AIAPPS_APP_GLOW = 'rgba(63,184,174,0.20)'; window.AIAPPS_LOGIN_SCENE = 'hourglass-time'; window.AIAPPS_LOGIN_LAYOUT = 'right';</script>
<script src="./supabase-client-app.js"></script>
<script src="./auth-gate.js"></script>
<script src="./update-notice.js"></script>
<style>
  :root{
    --ink:#16212B; --paper:#F5F6F4; --card:#FFFFFF; --line:#DFE1DC;
    --muted:#5C6670; --dark:#12242A; --dark-2:#1B3840;
    --teal:#2E8C86; --teal-text:#1F6763;
    --verde-bg:#E6F4EC; --verde-tx:#1F6B45;
    --ambar-bg:#FBF1DC; --ambar-tx:#7A5A12;
    --rojo-bg:#FBE9E7; --rojo-tx:#97362C;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;}

  header.app{background:var(--dark);color:#EAF3F2;padding:clamp(14px,3.5vw,22px) clamp(14px,4vw,30px);}
  .head-row{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;max-width:1180px;margin:0 auto;}
  header.app h1{margin:0;font-size:clamp(17px,4vw,21px);font-weight:700;letter-spacing:0.2px;}
  header.app .tagline{margin:4px 0 0;font-size:12px;color:#9FBFBC;letter-spacing:0.08em;text-transform:uppercase;}
  header.app a.hub{color:#BFE4E0;font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(191,228,224,0.45);}
  header.app a.hub:hover{color:#fff;}
  .running-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(63,184,174,0.16);border:1px solid rgba(63,184,174,0.45);color:#CFF0EC;border-radius:999px;padding:5px 12px;font-size:12.5px;}
  .running-chip .dot{width:8px;height:8px;border-radius:50%;background:#4FD1C5;animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  nav.tabs{background:var(--dark-2);padding:0 clamp(10px,4vw,30px);overflow-x:auto;}
  .tabs-inner{display:flex;gap:2px;max-width:1180px;margin:0 auto;}
  .tab{background:none;border:none;border-bottom:3px solid transparent;color:#AECDCA;padding:11px 15px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .tab:hover{color:#fff;}
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:#4FD1C5;font-weight:600;}
  .tab:focus-visible{outline:2px solid #7FE3DC;outline-offset:-3px;}

  main{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,22px) clamp(12px,4vw,30px) 96px;}
  /* El panel es una parada real del recorrido de Tab (tiene tabindex="0"),
     así que tiene que verse cuando recibe el foco. Antes llevaba
     outline:none y quien navega con teclado se quedaba sin saber dónde
     estaba parado. */
  [role="tabpanel"]:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;border-radius:8px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(13px,2.6vw,18px);margin-bottom:16px;}
  .panel > h2{font-size:12.5px;margin:0 0 12px;color:var(--teal-text);text-transform:uppercase;letter-spacing:0.7px;}
  /* Tabla de detalle plegable: <details> nativo, que trae el teclado y el
     estado expandido para lectores de pantalla sin JS de por medio. */
  details.panel > summary{cursor:pointer;list-style:none;border-radius:5px;}
  details.panel > summary::-webkit-details-marker{display:none;}
  details.panel > summary::marker{content:'';}
  details.panel > summary::before{content:'▸ ';color:var(--muted);}
  details.panel[open] > summary::before{content:'▾ ';}
  details.panel > summary h2{margin:0;}
  details.panel > summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .panel > h3{font-size:13.5px;margin:16px 0 8px;color:var(--ink);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field.grow{flex:1 1 170px;}
  label{font-size:12px;color:var(--muted);}
  input,select,textarea{font-family:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%;}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
  .btn{background:var(--teal-text);color:#fff;border:none;border-radius:6px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .btn:hover{background:#17514E;}
  .btn.ghost{background:#fff;color:var(--teal-text);border:1px solid var(--teal-text);}
  .btn.ghost:hover{background:#EAF4F3;}
  .btn.danger{background:#fff;color:#97362C;border:1px solid #C9756A;}
  .btn.danger:hover{background:#FBE9E7;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
  .stat{border:1px solid var(--line);border-radius:9px;padding:12px 13px;background:#FBFCFB;}
  .stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .stat .v{font-size:21px;font-weight:700;margin-top:3px;}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px;}

  .estado{border-radius:9px;padding:13px 15px;border:1px solid;}
  .estado h3{margin:0 0 4px;font-size:16px;}
  .estado p{margin:0;font-size:13px;}
  .estado.verde{background:var(--verde-bg);border-color:#A9D6BE;color:var(--verde-tx);}
  .estado.amarillo{background:var(--ambar-bg);border-color:#E0C27C;color:var(--ambar-tx);}
  .estado.rojo{background:var(--rojo-bg);border-color:#DDA096;color:var(--rojo-tx);}

  /* ── Gráficos del panel (CR-03) ── */
  .estado-grid{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;}
  .estado-ring{flex:none;display:flex;align-items:center;justify-content:center;}
  .ring{width:130px;height:130px;display:block;}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .chart-box{border:1px solid var(--line);border-radius:9px;padding:12px 13px;background:#FBFCFB;min-width:0;}
  .chart-box.wide{grid-column:1/-1;}
  .chart-box h3{font-size:12.5px;margin:0 0 10px;color:var(--teal-text);text-transform:uppercase;letter-spacing:0.6px;}
  .chart-box .hint{margin-top:8px;}
  .chart{width:100%;height:auto;display:block;}
  .donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .donut{width:140px;height:140px;flex:none;display:block;}
  .donut-legend{list-style:none;margin:0;padding:0;font-size:12.5px;flex:1 1 130px;min-width:0;}
  .donut-legend li{padding:3px 0;}
  .heatmap{width:100%;max-width:260px;height:auto;display:block;}

  .bar{height:9px;border-radius:999px;background:#ECEEEA;overflow:hidden;margin-top:6px;}
  .bar > span{display:block;height:100%;border-radius:999px;background:var(--teal);}
  .bar.over > span{background:#B0453A;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  .tablewrap{overflow-x:auto;}
  th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);font-weight:700;white-space:nowrap;}
  td.num,th.num{text-align:right;white-space:nowrap;}
  tbody tr:hover{background:#FAFBFA;}

  .chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#F2F4F2;color:#3A444C;white-space:nowrap;}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,0.15);}
  .muted{color:var(--muted);font-size:12.5px;}
  .empty{color:var(--muted);font-size:13px;padding:14px 2px;}
  .msg{font-size:12.5px;min-height:1.2em;margin-top:8px;}
  .msg.err{color:#97362C;}
  .msg.ok{color:var(--verde-tx);}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0;}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;}
  legend{font-size:12px;color:var(--muted);padding:0 5px;}

  .tracker{border:1px solid var(--line);border-radius:9px;padding:11px 13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .tracker .t-time{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .tracker.paused{background:#FAF9F5;}

  .modal-back{position:fixed;inset:0;background:rgba(10,20,24,0.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000;}
  .modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,0.35);}
  .modal h2{margin:0 0 8px;font-size:17px;color:#97362C;}
  .modal ul{margin:10px 0;padding-left:20px;font-size:13px;}
  .modal .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* ═══ Panel flotante de cronómetros (CR-01) ═══
     Se queda encima de toda la app, en cualquier pestaña, mientras haya algo
     corriendo. Va por debajo del pop-up de cronómetro olvidado (z-index 1000)
     y del candado de auth-gate, para no taparlos. */
  #float-panel{
    position:fixed;z-index:900;
    background:var(--dark);color:#EAF3F2;
    border:1px solid rgba(79,209,197,0.35);
    border-radius:12px;
    box-shadow:0 14px 40px rgba(0,0,0,0.45);
    width:min(310px, calc(100vw - 24px));
    font-size:13px;
    user-select:none;
  }
  #float-panel.min{width:auto;}
  .fp-head{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px 9px 12px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  #float-panel.min .fp-head{border-bottom:none;padding:8px 10px;}
  /* El asa es lo único que arrastra: así los botones siguen siendo botones.
     `cursor:grab` y `touch-action:none` para que en pantalla táctil el gesto
     mueva el panel en vez de desplazar la página. */
  .fp-grip{
    display:flex;align-items:center;gap:8px;flex:1;min-width:0;
    cursor:grab;touch-action:none;
  }
  .fp-grip:active{cursor:grabbing;}
  .fp-grip:focus-visible{outline:2px solid #7FE3DC;outline-offset:2px;border-radius:6px;}
  .fp-dots{flex:none;color:rgba(234,243,242,0.45);letter-spacing:1px;font-size:11px;}
  .fp-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fp-total{font-variant-numeric:tabular-nums;color:#7FE3DC;font-size:12.5px;white-space:nowrap;}
  .fp-btn{
    flex:none;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);
    color:#EAF3F2;border-radius:6px;width:26px;height:26px;line-height:1;
    font-size:14px;cursor:pointer;font-family:inherit;padding:0;
  }
  .fp-btn:hover{background:rgba(255,255,255,0.16);}
  .fp-btn:focus-visible{outline:2px solid #7FE3DC;outline-offset:1px;}
  .fp-body{max-height:min(50vh, 340px);overflow-y:auto;padding:4px 0;}
  .fp-item{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,0.07);}
  .fp-item:last-child{border-bottom:none;}
  .fp-proj{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;}
  .fp-proj .swatch{border-color:rgba(255,255,255,0.3);}
  .fp-sec{font-size:11px;color:#9FBFBC;text-transform:uppercase;letter-spacing:0.6px;margin-top:2px;}
  .fp-time{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;}
  .fp-item.paused .fp-time{color:#9FBFBC;}
  .fp-acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .fp-act{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);
    color:#EAF3F2;border-radius:6px;padding:4px 9px;font-size:11.5px;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .fp-act:hover{background:rgba(255,255,255,0.17);}
  .fp-act:focus-visible{outline:2px solid #7FE3DC;outline-offset:1px;}
  .fp-act.stop{border-color:rgba(240,160,150,0.5);color:#FFD8D2;}
  .fp-foot{
    padding:8px 12px;border-top:1px solid rgba(255,255,255,0.1);
  }
  .fp-foot button{
    width:100%;background:none;border:none;color:#7FE3DC;font-family:inherit;
    font-size:12px;cursor:pointer;padding:3px;text-align:center;border-radius:5px;
  }
  .fp-foot button:hover{background:rgba(127,227,220,0.12);}
  .fp-foot button:focus-visible{outline:2px solid #7FE3DC;outline-offset:1px;}
  .fp-pill{display:flex;align-items:center;gap:8px;}
  .fp-pill .dot{width:8px;height:8px;border-radius:50%;background:#4FD1C5;flex:none;animation:pulse 1.8s ease-in-out infinite;}

  /* Dentro de la ventana aparte no hay página que esquivar: el panel ocupa
     todo y de moverlo se encarga la ventana del sistema. */
  .pip-body{margin:0;background:var(--dark);}
  #float-panel.pip{
    position:static;width:100%;border:none;border-radius:0;box-shadow:none;
    min-height:100vh;display:flex;flex-direction:column;
  }
  #float-panel.pip .fp-body{max-height:none;flex:1;}
  #float-panel.pip .fp-grip{cursor:default;}
  /* Pastilla colapsada dentro de la ventana aparte (mirando Cronómetros):
     mismo look que la pastilla en página, pero centrada en la ventanita
     chica en vez de ocupar todo el alto. */
  #float-panel.pip.pip-mini{min-height:0;justify-content:center;padding:14px 4px;}
  #float-panel.pip.pip-mini .fp-pill{justify-content:center;}
  .fp-mini-close{

<script>
/* ═══════════════════════════════════════════════════════════════════
   Hourglass — seguimiento de tiempo personal
   Todo el cálculo (solapamiento, sobrecarga, reparto por día) vive aquí,
   en el navegador: LIPS-HUB no tiene backend propio. Decisión cerrada con
   la usuaria el 29/07/2026, ver docs/hourglass/prd-resumen.md.
   ═══════════════════════════════════════════════════════════════════ */

const SUPA_APP_ID = 'hourglass';
const CACHE_KEY = 'hourglass_v1';
const DAY = 86400000;
/* Tope de duración de UN registro. Nadie trabaja 31 días seguidos sin parar:
   un registro más largo que esto no es un dato real, es un JSON dañado o
   editado a mano (el puente de carpeta deja el archivo en disco). Sin este
   tope, un registro con fechas separadas por años hace que `segmentsOf()`
   genere millones de trozos de día y congele la pestaña — medido: 2.912.079
   segmentos y 14,58 s de bloqueo con un `fin` en el año 9999. */
const MAX_ENTRY_DAYS = 31;

/* Las secciones son fijas: viven en el código, no en los datos.
   "Bloques Fijos" es distinta de las otras tres: no se le crean proyectos a
   mano y su tiempo NO compite por las horas disponibles del día — es
   justamente lo que las define (CR-02). */
const SECTIONS = [
  { id:'trabajo',      nombre:'Trabajo',      color:'#2E8C86' },
  { id:'voluntariado', nombre:'Voluntariado', color:'#B8862F' },
  { id:'personal',     nombre:'Personal',     color:'#7C6BB0' },
  { id:'fijos',        nombre:'Bloques Fijos', color:'#6B7A8F', sistema:true }
];
const SECTION_IDS = SECTIONS.map(s => s.id);
// Secciones donde la usuaria puede crear proyectos.
const SECCIONES_EDITABLES = SECTIONS.filter(s => !s.sistema);

/* Los dos proyectos automáticos de Bloques Fijos. Existen siempre, no se
   pueden borrar ni renombrar, y sus registros los genera la app sola. */
const FIJOS = [
  { id:'fx-sueno',  tipo:'sueno',  nombre:'Sueño',   color:'#5B6E86', horaInicio:0  },
  { id:'fx-comida', tipo:'comida', nombre:'Comidas', color:'#8A7B6B', horaInicio:12 }
];
const FIJO_POR_TIPO = { sueno: FIJOS[0], comida: FIJOS[1] };
const FIJO_IDS = FIJOS.map(f => f.id);
function esProyectoFijo(id){ return FIJO_IDS.indexOf(id) !== -1; }
// Máximo de días que se generan hacia atrás de una sentada, para que abrir la
// app después de meses no cree miles de registros de golpe.
const MAX_DIAS_GENERADOS = 31;
const PALETTE = ['#2E8C86','#B8862F','#7C6BB0','#4E7A8B','#B85C4E','#5F8A4E','#8B6BA0','#C07A4E'];

const DEFAULTS = {
  timezone:'America/Santo_Domingo',
  sleepHoursDefault:7,
  mealHoursDefault:3,
  staleTrackerAlertHours:6,
  // Abrir sola la ventana flotante al poner en marcha un cronómetro.
  autoVentanaFlotante:true
};

let state = emptyState();
let cloudSyncReady = false;
let cachedUserId = null;

function emptyState(){
  return {
    version:1,
    settings:Object.assign({}, DEFAULTS),
    projects:[],
    entries:[],
    activeTrackers:[],
    fixedBlockOverrides:[],
    // Último día para el que ya se generaron los registros automáticos de
    // sueño y comidas, para no repetirlos ni saltárselos.
    ultimoDiaFijosGenerado:null
  };
}

/* ───────────────────── utilidades ───────────────────── */

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v, fallback){ const n = Number(v); return isFinite(n) ? n : fallback; }
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
// Los colores llegan de un <input type="color">, pero también podrían venir de
// un JSON de la nube manipulado: se validan antes de escribirlos en un style.
function safeColor(c, fallback){
  return /^#[0-9a-fA-F]{6}$/.test(String(c || '')) ? String(c) : (fallback || '#2E8C86');
}
function isDayKey(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(Date.parse(s + 'T00:00:00Z')); }
function isIso(s){ return typeof s === 'string' && !isNaN(Date.parse(s)); }

function fmtDur(min){
  const m = Math.max(0, Math.round(min));
  const h = Math.floor(m / 60);
  const r = m % 60;
  if(h && r) return h + ' h ' + r + ' min';
  if(h) return h + ' h';
  return r + ' min';
}
function fmtHoursShort(min){ return (Math.round(min / 6) / 10).toFixed(1).replace('.', ',') + ' h'; }
function fmtClock(ms){
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ───────────────────── zona horaria ─────────────────────
   Todo el cálculo se hace en "milisegundos zonificados": el instante real
   desplazado al huso de `settings.timezone`. Así partir por día calendario
   es una simple división entre 86.400.000, sin depender del huso del equipo
   donde se abra la app. */
let tzWarned = false;
function tzName(){ return state.settings.timezone || DEFAULTS.timezone; }

/* El formateador se guarda y se reusa. Construir un Intl.DateTimeFormat es
   caro, y `offsetMin` se llama en cada conversión de fecha: creándolo cada vez,
   la vista Año llegaba a decenas de miles de construcciones y tardaba tanto
   que parecía colgada. Se rehace solo si cambia la zona horaria. */
let tzFmt = null, tzFmtName = null;
function tzFormatter(){
  const name = tzName();
  if(tzFmt && tzFmtName === name) return tzFmt;
  tzFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: name, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
  tzFmtName = name;
  return tzFmt;
}

function offsetMin(ms){
  try{
    const p = {};
    tzFormatter().formatToParts(new Date(ms)).forEach(x => { if(x.type !== 'literal') p[x.type] = x.value; });
    let h = +p.hour; if(h === 24) h = 0;
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second);
    return Math.round((asUTC - Math.floor(ms / 1000) * 1000) / 60000);
  }catch(e){
    if(!tzWarned){
      console.warn('[Hourglass] Zona horaria no reconocida ("' + tzName() + '"), se usa la del navegador.');
      tzWarned = true;
    }
    return -new Date(ms).getTimezoneOffset();
  }
}
function toZoned(ms){ return ms + offsetMin(ms) * 60000; }
// Inversa aproximada: se estima el instante y se recalcula el desfase con él,
// que es lo correcto salvo en la hora exacta de un cambio de horario.
function fromZoned(z){
  const guess = z - offsetMin(z) * 60000;
  return z - offsetMin(guess) * 60000;
}
function dayKeyOf(z){ return new Date(z).toISOString().slice(0,10); }
function dayStartZ(key){ return Date.parse(key + 'T00:00:00Z'); }
function zonedNow(){ return toZoned(Date.now()); }
function todayKey(){ return dayKeyOf(zonedNow()); }
function hhmmOf(z){
  const d = new Date(z);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
}
function isoFromLocal(dateStr, timeStr){
  if(!isDayKey(dateStr)) return null;
  const z = Date.parse(dateStr + 'T' + (timeStr || '00:00') + ':00Z');
  if(isNaN(z)) return null;
  return new Date(fromZoned(z)).toISOString();
}
function fmtDayLong(key){
  const d = new Date(dayStartZ(key));
  return d.toLocaleDateString('es-DO', { weekday:'short', day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' });
}
function fmtDayShort(key){
  const d = new Date(dayStartZ(key));
  return d.toLocaleDateString('es-DO', { day:'2-digit', month:'short', timeZone:'UTC' });
}

/* ───────────────────── normalización de datos ─────────────────────
   El JSON puede venir de la nube, de la caché local o de un archivo de la
   carpeta: nada de eso está garantizado, así que se normaliza antes de usarlo
   en vez de confiar en su forma. */
function normalize(raw){
  const s = emptyState();
  if(!raw || typeof raw !== 'object') return s;
  const set = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
  // El recorte es por consistencia con `nombre`/`nota`: ningún identificador
  // de zona horaria real pasa de 64 caracteres.
  s.settings.timezone = typeof set.timezone === 'string' && set.timezone ? set.timezone.slice(0, 64) : DEFAULTS.timezone;
  s.settings.sleepHoursDefault = clamp(num(set.sleepHoursDefault, DEFAULTS.sleepHoursDefault), 0, 24);
  s.settings.mealHoursDefault = clamp(num(set.mealHoursDefault, DEFAULTS.mealHoursDefault), 0, 24);
  s.settings.staleTrackerAlertHours = clamp(num(set.staleTrackerAlertHours, DEFAULTS.staleTrackerAlertHours), 1, 48);
  s.settings.autoVentanaFlotante = set.autoVentanaFlotante === undefined
    ? DEFAULTS.autoVentanaFlotante : !!set.autoVentanaFlotante;

  (Array.isArray(raw.projects) ? raw.projects : []).forEach((p, i) => {
    if(!p || typeof p !== 'object') return;
    if(esProyectoFijo(p.id)) return; // se reponen abajo desde la constante
    s.projects.push({
      id: String(p.id || uid('p')),
      sectionId: SECCIONES_EDITABLES.some(x => x.id === p.sectionId) ? p.sectionId : 'trabajo',
      nombre: String(p.nombre || 'Sin nombre').slice(0, 120),
      color: safeColor(p.color, PALETTE[i % PALETTE.length]),
      estado: p.estado === 'archivado' ? 'archivado' : 'activo',
      metaHorasSemanales: p.metaHorasSemanales == null || p.metaHorasSemanales === ''
        ? null : clamp(num(p.metaHorasSemanales, 0), 0, 168)
    });
  });
  /* Los proyectos automáticos se reponen siempre desde la constante, nunca
     desde el JSON: así no se pueden renombrar, mover de sección ni perder
     editando el archivo de datos a mano. */
  FIJOS.forEach(f => {
    s.projects.push({
      id: f.id, sectionId:'fijos', nombre: f.nombre, color: f.color,
      estado:'activo', metaHorasSemanales:null, sistema:true
    });
  });

  let descartados = 0;
  (Array.isArray(raw.entries) ? raw.entries : []).forEach(e => {
    if(!e || typeof e !== 'object') return;
    if(!isIso(e.inicio) || !isIso(e.fin)) return;
    if(Date.parse(e.fin) - Date.parse(e.inicio) > MAX_ENTRY_DAYS * DAY){
      descartados++;
      return;
    }
    const pausas = (Array.isArray(e.pausas) ? e.pausas : [])
      .filter(p => p && isIso(p.from) && isIso(p.to))
      .map(p => ({ from: new Date(p.from).toISOString(), to: new Date(p.to).toISOString() }));
    const entry = {
      id: String(e.id || uid('e')),
      projectId: String(e.projectId || ''),
      origen: (e.origen === 'tracker' || e.origen === 'auto') ? e.origen : 'manual',
      inicio: new Date(e.inicio).toISOString(),
      fin: new Date(e.fin).toISOString(),
      duracionMin: 0,
      nota: String(e.nota || '').slice(0, 500),
      editado: !!e.editado,
      pausas: pausas
    };
    entry.duracionMin = activeMinutes(entry);
    s.entries.push(entry);
  });

  if(descartados){
    console.warn('[Hourglass] Se descartaron ' + descartados + ' registro(s) con una duración imposible (más de ' + MAX_ENTRY_DAYS + ' días). Suelen venir de un archivo de datos dañado o editado a mano.');
  }

  (Array.isArray(raw.activeTrackers) ? raw.activeTrackers : []).forEach(t => {
    if(!t || typeof t !== 'object' || !isIso(t.startedAt)) return;
    s.activeTrackers.push({
      id: String(t.id || uid('t')),
      projectId: String(t.projectId || ''),
      startedAt: new Date(t.startedAt).toISOString(),
      pausedIntervals: (Array.isArray(t.pausedIntervals) ? t.pausedIntervals : [])
        .filter(p => p && isIso(p.from))
        .map(p => ({ from: new Date(p.from).toISOString(), to: isIso(p.to) ? new Date(p.to).toISOString() : null })),
      nota: String(t.nota || '').slice(0, 500)
    });
  });

  (Array.isArray(raw.fixedBlockOverrides) ? raw.fixedBlockOverrides : []).forEach(o => {
    if(!o || typeof o !== 'object' || !isDayKey(o.fecha)) return;
    if(o.tipo !== 'sueno' && o.tipo !== 'comida') return;
    s.fixedBlockOverrides.push({ fecha: o.fecha, tipo: o.tipo, horas: clamp(num(o.horas, 0), 0, 24) });
  });

  if(isDayKey(raw.ultimoDiaFijosGenerado)) s.ultimoDiaFijosGenerado = raw.ultimoDiaFijosGenerado;

  // Un proyecto borrado no debe dejar registros huérfanos que no se puedan
  // ver ni corregir desde ninguna pantalla.
  const ids = {};
  s.projects.forEach(p => { ids[p.id] = true; });
  s.entries = s.entries.filter(e => ids[e.projectId]);
  // Los bloques fijos no se cronometran: un tracker suyo solo puede venir de
  // un dato manipulado.
  s.activeTrackers = s.activeTrackers.filter(t => ids[t.projectId] && !esProyectoFijo(t.projectId));
  return s;
}

/* ── Registros automáticos de sueño y comidas (CR-02) ──
   Antes sueño y comidas eran solo una resta invisible; ahora son registros de
   verdad: se ven en el historial y en el panel, y se editan uno por uno.
   El día del que se generan: se generan para todos los días hasta HOY
   inclusive, no solo al cerrar el día. Generarlos solo al cierre dejaría el
   día en curso sin bloques, y entonces el panel diría que hoy hay 24 h
   disponibles hasta la medianoche — que es justo el número que la app existe
   para no equivocar. */

function entradasFijasDe(dayKey, tipo){
  const f = FIJO_POR_TIPO[tipo];
  if(!f) return [];
  return state.entries.filter(e => e.projectId === f.id
    && dayKeyOf(toZoned(Date.parse(e.inicio))) === dayKey);
}

function crearEntradaFija(dayKey, tipo, horas){
  const f = FIJO_POR_TIPO[tipo];
  const h = clamp(num(horas, 0), 0, 24);
  if(!f || h <= 0) return null;
  const desde = String(f.horaInicio).padStart(2, '0') + ':00';
  const inicioIso = isoFromLocal(dayKey, desde);
  if(!inicioIso) return null;
  const entry = {
    id: uid('e'), projectId: f.id, origen:'auto',
    inicio: inicioIso,
    fin: new Date(Date.parse(inicioIso) + Math.round(h * 60) * 60000).toISOString(),
    duracionMin: Math.round(h * 60), nota:'', editado:false, pausas:[]
  };
  state.entries.push(entry);
  return entry;
}

// Deja ese día con exactamente `horas` de ese bloque, reemplazando lo que
// hubiera. Es lo que usan los controles del panel y de Ajustes.
function setHorasFijas(dayKey, tipo, horas){
  const f = FIJO_POR_TIPO[tipo];
  if(!f) return;
  state.entries = state.entries.filter(e => !(e.projectId === f.id
    && dayKeyOf(toZoned(Date.parse(e.inicio))) === dayKey));
  crearEntradaFija(dayKey, tipo, horas);
}

function generarFijosPendientes(){
  const hoy = todayKey();
  let desde;
  if(isDayKey(state.ultimoDiaFijosGenerado)){
    desde = dayKeyOf(dayStartZ(state.ultimoDiaFijosGenerado) + DAY);
  }else{
    desde = hoy; // primera vez: solo hoy, sin reescribir el pasado
  }
  if(desde > hoy){ return 0; }
  let dias = dayKeysInRange(desde, hoy);
  if(dias.length > MAX_DIAS_GENERADOS) dias = dias.slice(dias.length - MAX_DIAS_GENERADOS);
  let creados = 0;
  dias.forEach(d => {
    ['sueno', 'comida'].forEach(tipo => {
      if(entradasFijasDe(d, tipo).length) return; // ya existe, no duplicar
      // Si ese día tenía una excepción del modelo viejo, se respeta al
      // convertirla en registro.
      const ov = state.fixedBlockOverrides.find(o => o.fecha === d && o.tipo === tipo);
      const horas = ov ? ov.horas : (tipo === 'sueno'
        ? state.settings.sleepHoursDefault : state.settings.mealHoursDefault);
      if(crearEntradaFija(d, tipo, horas)) creados++;
    });
  });
  state.ultimoDiaFijosGenerado = hoy;
  return creados;
}

function projectById(id){ return state.projects.find(p => p.id === id) || null; }
function sectionById(id){ return SECTIONS.find(s => s.id === id) || SECTIONS[0]; }
function projectName(id){ const p = projectById(id); return p ? p.nombre : '(proyecto eliminado)'; }

/* ───────────────────── cálculo de tiempo ─────────────────────
   Regla de negocio no negociable (PRD §8.2): la sobrecarga se mide con
   tiempo de reloj REAL (intervalos solapados fusionados), no con la suma
   bruta por proyecto. */

// Intervalos realmente trabajados de un registro, en ms zonificados,
// descontando las pausas del cronómetro.
function entryIntervals(e){
  const s = toZoned(Date.parse(e.inicio));
  const f = toZoned(Date.parse(e.fin));
  if(!(f > s)) return [];
  let parts = [{ from:s, to:f }];
  (e.pausas || []).forEach(p => {
    const ps = toZoned(Date.parse(p.from));
    const pe = toZoned(Date.parse(p.to));
    if(!(pe > ps)) return;
    const next = [];
    parts.forEach(seg => {
      if(pe <= seg.from || ps >= seg.to){ next.push(seg); return; }
      if(ps > seg.from) next.push({ from:seg.from, to:Math.min(ps, seg.to) });
      if(pe < seg.to) next.push({ from:Math.max(pe, seg.from), to:seg.to });
    });
    parts = next;
  });
  return parts;
}
function activeMinutes(e){
  return Math.round(entryIntervals(e).reduce((a, iv) => a + (iv.to - iv.from), 0) / 60000);
}

// Un registro que cruza medianoche se parte en el CÁLCULO, nunca en el dato
// guardado (decisión 2 cerrada con la usuaria).
function segmentsOf(e){
  const out = [];
  // Tope duro de trozos por registro. `normalize()` ya descarta los registros
  // guardados con una duración imposible, pero los cronómetros en curso NO
  // pasan por ahí (se convierten en registro virtual con `fin` = ahora): uno
  // con una fecha de inicio disparatada llegaría hasta aquí. Sin este tope el
  // bucle congela la pestaña entera; con él, el peor caso es que ese registro
  // roto reporte de menos, que se puede ver y corregir.
  const maxSegs = MAX_ENTRY_DAYS + 2;
  entryIntervals(e).forEach(iv => {
    let cur = iv.from;
    while(cur < iv.to && out.length < maxSegs){
      const dStart = Math.floor(cur / DAY) * DAY;
      const to = Math.min(iv.to, dStart + DAY);
      out.push({ day: dayKeyOf(dStart), from: cur, to: to, entry: e });
      cur = to;
    }
  });
  return out;
}

function mergedMinutes(list){
  if(!list.length) return 0;
  const s = list.slice().sort((a, b) => a.from - b.from);
  let total = 0, cf = s[0].from, ct = s[0].to;
  for(let i = 1; i < s.length; i++){
    if(s[i].from <= ct) ct = Math.max(ct, s[i].to);
    else { total += ct - cf; cf = s[i].from; ct = s[i].to; }
  }
  total += ct - cf;
  return Math.round(total / 60000);
}

// Los cronómetros en curso cuentan como tiempo provisional hasta "ahora":
// sin eso el panel avisaría de la sobrecarga solo después de detenerlos.
function trackerAsEntry(t, nowMs){
  const pausas = (t.pausedIntervals || [])
    .map(p => ({ from:p.from, to: p.to || new Date(nowMs).toISOString() }))
    .filter(p => Date.parse(p.to) > Date.parse(p.from));
  return {
    id: 'live-' + t.id, projectId: t.projectId, origen:'tracker',
    inicio: t.startedAt, fin: new Date(nowMs).toISOString(),
    nota: t.nota, editado:false, pausas: pausas, live:true
  };
}
/* Los registros de bloques fijos NO entran en el cálculo de carga: no compiten
   por las horas disponibles, son las que las definen. Si entraran, el día
   arrancaría con 10 h ocupadas de 14 disponibles y todo saldría en rojo
   siempre. Se muestran aparte, en su propia tarjeta. */
function esEntradaFija(e){ return esProyectoFijo(e.projectId); }

function allEntries(){
  const now = Date.now();
  return state.entries.filter(e => !esEntradaFija(e))
    .concat(state.activeTrackers.map(t => trackerAsEntry(t, now)));
}

/* Las horas de sueño/comida de un día salen de sus REGISTROS, que son ahora
   la única fuente de verdad (CR-02): editar el registro de un día cambia sus
   horas disponibles, y cambiar el valor por defecto solo afecta a los días que
   se generen después. Para días anteriores a este cambio, que no tienen
   registros, se sigue leyendo la excepción vieja o el valor por defecto. */
/* Índice día → minutos de sueño/comida, construido de una sola pasada.
   Sin él, calcular un año entero preguntaba las horas de cada día recorriendo
   todos los registros: 365 días × 2 bloques × N registros. */
function indiceFijos(){
  const idx = {};
  state.entries.forEach(e => {
    if(!esEntradaFija(e)) return;
    const d = dayKeyOf(toZoned(Date.parse(e.inicio)));
    const tipo = e.projectId === FIJO_POR_TIPO.sueno.id ? 'sueno' : 'comida';
    if(!idx[d]) idx[d] = { sueno:0, comida:0 };
    idx[d][tipo] += e.duracionMin;
  });
  return idx;
}

function blockHoursFrom(idx, dayKey, tipo){
  const dia = idx[dayKey];
  if(dia && dia[tipo] > 0) return clamp(dia[tipo] / 60, 0, 24);
  const ov = state.fixedBlockOverrides.find(o => o.fecha === dayKey && o.tipo === tipo);
  if(ov) return clamp(num(ov.horas, 0), 0, 24);
  return tipo === 'sueno'
    ? clamp(num(state.settings.sleepHoursDefault, DEFAULTS.sleepHoursDefault), 0, 24)
    : clamp(num(state.settings.mealHoursDefault, DEFAULTS.mealHoursDefault), 0, 24);
}
function availableMinutesFrom(idx, dayKey){
  return Math.max(0, Math.round((24 - blockHoursFrom(idx, dayKey, 'sueno') - blockHoursFrom(idx, dayKey, 'comida')) * 60));
}

// Versiones sueltas, para los pocos sitios de la interfaz que preguntan por un
// día concreto (los campos del panel y de Ajustes).
function blockHours(dayKey, tipo){ return blockHoursFrom(indiceFijos(), dayKey, tipo); }
function availableMinutes(dayKey){ return availableMinutesFrom(indiceFijos(), dayKey); }
function dayKeysInRange(from, to){
  const out = [];
  const a = dayStartZ(from), b = dayStartZ(to);
  if(isNaN(a) || isNaN(b) || b < a) return out;
  // Tope de seguridad: el rango personalizado ya está acotado a un año, pero
  // un dato corrupto no debe poder colgar el navegador con un bucle largo.
  for(let z = a; z <= b && out.length < 400; z += DAY) out.push(dayKeyOf(z));
  return out;
}

/* Resumen completo de un rango: es la ÚNICA función que calcula totales, para
   que panel, informes y cualquier exportación futura no puedan divergir. */
function summarize(from, to){
  const days = dayKeysInRange(from, to);
  const inRange = {};
  days.forEach(d => { inRange[d] = true; });
  // Una sola pasada para todo el rango, en vez de una consulta por día.
  const idxFijos = indiceFijos();

  const segs = [];
  allEntries().forEach(e => {
    segmentsOf(e).forEach(sg => { if(inRange[sg.day]) segs.push(sg); });
  });

  const byProject = {}, bySection = {}, byDay = {};
  days.forEach(d => { byDay[d] = { day:d, segs:[], brutoMin:0 }; });
  segs.forEach(sg => {
    const p = projectById(sg.entry.projectId);
    const secId = p ? p.sectionId : 'trabajo';
    const min = (sg.to - sg.from) / 60000;
    if(!byProject[sg.entry.projectId]) byProject[sg.entry.projectId] = { projectId:sg.entry.projectId, brutoMin:0, segs:[] };
    byProject[sg.entry.projectId].brutoMin += min;
    byProject[sg.entry.projectId].segs.push(sg);
    if(!bySection[secId]) bySection[secId] = { sectionId:secId, brutoMin:0, segs:[] };
    bySection[secId].brutoMin += min;
    bySection[secId].segs.push(sg);
    byDay[sg.day].segs.push(sg);
    byDay[sg.day].brutoMin += min;
  });

  Object.keys(byProject).forEach(k => {
    byProject[k].brutoMin = Math.round(byProject[k].brutoMin);
    byProject[k].relojMin = mergedMinutes(byProject[k].segs);
  });
  Object.keys(bySection).forEach(k => {
    bySection[k].brutoMin = Math.round(bySection[k].brutoMin);
    bySection[k].relojMin = mergedMinutes(bySection[k].segs);
  });

  // Reparto por sección dentro de cada día, para las barras apiladas. Incluye
  // los bloques fijos, que no cuentan para la carga pero sí forman parte de
  // cómo se repartió el día de verdad.
  const porDiaSeccion = {};
  days.forEach(d => {
    porDiaSeccion[d] = {};
    SECTIONS.forEach(s => { porDiaSeccion[d][s.id] = 0; });
  });
  segs.forEach(sg => {
    const p = projectById(sg.entry.projectId);
    const secId = p ? p.sectionId : 'trabajo';
    porDiaSeccion[sg.day][secId] += (sg.to - sg.from) / 60000;
  });

  let availMin = 0;
  days.forEach(d => {
    const disp = availableMinutesFrom(idxFijos, d);
    availMin += disp;
    byDay[d].brutoMin = Math.round(byDay[d].brutoMin);
    byDay[d].relojMin = mergedMinutes(byDay[d].segs);
    byDay[d].availMin = disp;
    byDay[d].estado = statusOf(byDay[d].relojMin, disp);
    porDiaSeccion[d].fijos = Math.round((blockHoursFrom(idxFijos, d, 'sueno') + blockHoursFrom(idxFijos, d, 'comida')) * 60);
    SECCIONES_EDITABLES.forEach(s => { porDiaSeccion[d][s.id] = Math.round(porDiaSeccion[d][s.id]); });
    byDay[d].porSeccion = porDiaSeccion[d];
  });

  const relojMin = mergedMinutes(segs);
  const brutoMin = Math.round(segs.reduce((a, sg) => a + (sg.to - sg.from) / 60000, 0));
  const sleepMin = Math.round(days.reduce((a, d) => a + blockHoursFrom(idxFijos, d, 'sueno') * 60, 0));
  const mealMin = Math.round(days.reduce((a, d) => a + blockHoursFrom(idxFijos, d, 'comida') * 60, 0));

  let topSection = null;
  Object.keys(bySection).forEach(k => {
    if(!topSection || bySection[k].relojMin > bySection[topSection].relojMin) topSection = k;
  });

  return {
    from, to, days,
    relojMin, brutoMin, availMin, sleepMin, mealMin,
    sinRegistrarMin: Math.max(0, availMin - relojMin),
    estado: statusOf(relojMin, availMin),
    topSection: topSection,
    byProject, bySection, byDay,
    liveCount: state.activeTrackers.length
  };
}

function statusOf(relojMin, availMin){
  if(availMin <= 0) return relojMin > 0 ? 'rojo' : 'verde';
  const r = relojMin / availMin;
  if(r > 1) return 'rojo';
  if(r >= 0.85) return 'amarillo';
  return 'verde';
}
const ESTADO_TEXTO = {
  verde:   { titulo:'Carga bajo control', clase:'verde' },
  amarillo:{ titulo:'Cerca del límite',   clase:'amarillo' },
  rojo:    { titulo:'Sobrecarga',         clase:'rojo' }
};

/* ───────────────────── persistencia ───────────────────── */

function scopedKey(key, userId){ return userId ? key + '::' + userId : key; }

async function getSupabaseSession(){
  if(!window.supabaseClient) return null;
  const { data } = await window.supabaseClient.auth.getSession();
  return data && data.session ? data.session : null;
}

function serialize(){
  return {
    version: 1,
    settings: state.settings,
    projects: state.projects,
    entries: state.entries,
    activeTrackers: state.activeTrackers,
    fixedBlockOverrides: state.fixedBlockOverrides,
    ultimoDiaFijosGenerado: state.ultimoDiaFijosGenerado
  };
}

function save(){
  // Se vuelve a resolver la sesión en vez de confiar en cachedUserId, para que
  // un guardado disparado antes de que load() termine no caiga en la clave sin
  // aislar por usuario.
  (async () => {
    const session = await getSupabaseSession();
    const uidNow = session ? session.user.id : null;
    try{
      localStorage.setItem(scopedKey(CACHE_KEY, uidNow), JSON.stringify(serialize()));
    }catch(e){
      console.warn('[Hourglass] No se pudo escribir la caché local:', e);
    }
  })();
  syncToCloud();
}

async function syncToCloud(){
  const session = await getSupabaseSession();
  if(!session) return;
  if(!cloudSyncReady) return;
  try{
    const { error } = await window.supabaseClient
      .from('app_data')
      .upsert(
        { user_id: session.user.id, app_id: SUPA_APP_ID, data: serialize(), updated_at: new Date().toISOString() },
        { onConflict: 'user_id,app_id' }
      );
    if(error) throw error;
  }catch(e){
    console.warn('[Hourglass] Guardado local OK, pero falló la sincronización con la nube:', e);
  }
}

function loadFromLocalStorage(userId){
  try{
    const raw = localStorage.getItem(scopedKey(CACHE_KEY, userId));
    state = normalize(raw ? JSON.parse(raw) : null);
  }catch(e){
    console.warn('[Hourglass] Caché local ilegible, se empieza vacío:', e);
    state = emptyState();
  }
}

async function load(){
  const session = await getSupabaseSession();
  if(!session) return; // Sin sesión no se cargan datos reales detrás del candado.
  cachedUserId = session.user.id;
  try{
    const { data, error } = await window.supabaseClient
      .from('app_data')
      .select('data')
      .eq('app_id', SUPA_APP_ID)
      .eq('user_id', session.user.id)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data){
      state = normalize(data.data);
      try{ localStorage.setItem(scopedKey(CACHE_KEY, cachedUserId), JSON.stringify(serialize())); }catch(e){}
      return;
    }
    loadFromLocalStorage(cachedUserId);
  }catch(e){
    console.warn('[Hourglass] No se pudo leer de la nube, usando caché local:', e);
    loadFromLocalStorage(cachedUserId);
  }
}
