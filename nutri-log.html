<style>
/* ===== Nutri Log — sistema de diseño "Organic" =====
   Tokens y clases de componente tomados literalmente de
   design-system/styles.css del paquete de mockups (fuente de verdad visual),
   más el layout propio de la app (sidebar web / navegación por pestañas).
   La adaptación a móvil (392px, tab bar inferior) es el último paso — hasta
   entonces el layout asume escritorio/web. */
@import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');

:root{
  --color-bg:#f5ead8; --color-surface:#ebddc5; --color-text:#201e1d;
  --color-accent:#c67139; --color-accent-2:#7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5; --color-neutral-500:#a19786; --color-neutral-600:#82796a;
  --color-neutral-700:#645c50; --color-neutral-800:#474238; --color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b; --color-accent-500:#d67f48; --color-accent-600:#b2622d;
  --color-accent-700:#8c491a; --color-accent-800:#643312; --color-accent-900:#402310;

  --color-accent-2-100:#f0fae1; --color-accent-2-200:#e1eecc; --color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92; --color-accent-2-500:#8fa073; --color-accent-2-600:#728157;
  --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b; --color-accent-2-900:#272e1b;

  --font-heading:"Caprasimo", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, sans-serif;

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px; --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;
  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;

  --shadow-sm:0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
  --shadow-md:0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);

  /* Escape para el aviso de version nueva: alto real de la barra propia. */
  --aiapps-chrome-top: 0px;
}

*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); font-size:15px; line-height:1.55; font-weight:400; }
h1,h2,h3,h4,h5,h6{ font-family:var(--font-heading); font-weight:400; line-height:1.12; letter-spacing:-.015em; margin:0 0 var(--space-2); }
h1{ font-size:42px; } h2{ font-size:32px; } h3{ font-size:25px; } h4{ font-size:20px; } h5{ font-size:16px; }
p{ margin:0 0 var(--space-3); }
a{ color:var(--color-accent); text-underline-offset:3px; }
img{ display:block; max-width:100%; }
.text-muted{ color:color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px; }
.washed{ filter:saturate(.6) contrast(.85) brightness(1.1) opacity(.94); }

.hr{ height:1px; border:0; margin:var(--space-4) 0; background:var(--color-divider); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; text-decoration:none;
  font-family:var(--font-heading); font-weight:400; font-size:14px; line-height:1.2; color:var(--color-text);
  background:transparent; border:1px solid transparent; padding:var(--space-2) calc(var(--space-3) * 1.2); border-radius:999px; }
.btn svg{ display:block; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--color-accent); color:#fff; }
.btn-primary:hover{ background:var(--color-accent-600); }
.btn-primary:active{ background:var(--color-accent-700); }
.btn-secondary{ border-color:var(--color-divider); }
.btn-secondary:hover{ background:color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost{ color:var(--color-accent); padding-inline:var(--space-1); }
.btn-ghost:hover{ background:color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-icon{ width:36px; height:36px; padding:0; }
.btn-block{ width:100%; margin-top:var(--space-2); }

<script>
"use strict";
/* ===== Nutri Log — app de seguimiento de consumo de productos alimenticios =====
   PRD v1.2 (12/08/2026), RF-01 a RF-43. Recreación en vanilla JS del handoff
   "design_handoff_nutri_log" (Nutri Log.dc.html + design system Organic),
   siguiendo el mismo patrón de archivo único que el resto de LIPS-HUB
   (bitacora-mentor.html, StaffGate.html, etc.): sin build step, sin
   framework, persistencia vía Supabase (tabla app_data) + localStorage.

   Construcción por bloques (ver commits): andamiaje → motor de cálculo →
   pantallas → integración al hub → pase responsive móvil AL FINAL. */

const SUPA_APP_ID = 'nutri-log';

/* ===== Persistencia (mismo patrón que bitacora-mentor.html) ===== */
async function getSupabaseSession(){
  if(!window.supabaseClient) return null;
  const { data } = await window.supabaseClient.auth.getSession();
  return data && data.session ? data.session : null;
}
function scopedKey(key, userId){ return userId ? `${key}::${userId}` : key; }
function migrateLegacyCache(baseKey, scoped){
  if(scoped === baseKey) return;
  if(localStorage.getItem(scoped) !== null) return;
  const legacy = localStorage.getItem(baseKey);
  if(legacy !== null) localStorage.setItem(scoped, legacy);
}
let cloudSyncReady = false;
const STORAGE_KEY = 'nutrilog-data';
const storageAdapter = {
  async get(key){
    const session = await getSupabaseSession();
    if(session){
      const localKey = scopedKey(key, session.user.id);
      migrateLegacyCache(key, localKey);
      try{
        const { data, error } = await window.supabaseClient
          .from('app_data').select('data')
          .eq('app_id', SUPA_APP_ID).eq('user_id', session.user.id)
          .maybeSingle();
        if(error) throw error;
        if(data && data.data){
          const value = JSON.stringify(data.data);
          localStorage.setItem(localKey, value);
          return { key, value };
        }
        const raw = localStorage.getItem(localKey);
        return raw ? { key, value: raw } : null;
      }catch(e){
        console.warn('[Nutri Log] No se pudo leer de la nube, usando caché local:', e);
        const raw = localStorage.getItem(localKey);
        return raw ? { key, value: raw } : null;
      }
    }
    return null;
  },
  async set(key, value){
    const session = await getSupabaseSession();
    if(!session) return { key, value };
    localStorage.setItem(scopedKey(key, session.user.id), value);
    if(!cloudSyncReady) return { key, value };
    try{
      const { error } = await window.supabaseClient
        .from('app_data').upsert(
          { user_id: session.user.id, app_id: SUPA_APP_ID, data: JSON.parse(value), updated_at: new Date().toISOString() },
          { onConflict: 'user_id,app_id' }
        );
      if(error) throw error;
    }catch(e){
      console.warn('[Nutri Log] Guardado local OK, pero falló la sincronización con la nube:', e);
    }
    return { key, value };
  }
};

/* ===== Helpers ===== */
function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* Zona horaria fija America/Santo_Domingo para el corte de dia (9.10 del PRD),
   mismo criterio que Hourglass: la racha y el check-in del reto no deben
   depender de en que zona horaria este el navegador de quien use la app. */
const NL_TZ = 'America/Santo_Domingo';
function nlToday(){
  // en-CA da YYYY-MM-DD directo, formato ISO de fecha sin hora.
  return new Intl.DateTimeFormat('en-CA', { timeZone: NL_TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
}

/* ===== Motor de calculo de efectos (RF-15, RF-16, RF-17) =====
   Se implementa como funcion pura reutilizable (11. arquitectura sugerida):
   recibe una lista de compuestos con sus tags y devuelve el perfil agregado.
   Regla de intensidad (documentada en 8.3 del PRD): mas ingredientes activos
   en una categoria = mayor intensidad. 1 aporte = baja, 2 = media, 3+ = alta. */
function computeEffectProfile(recipe){
  const product = state.products.find(p => p.id === recipe.productId);
  const allCompoundRefs = (product ? product.compounds : []).concat(recipe.extraCompounds || []);
  const byEffect = {};
  allCompoundRefs.forEach(ref => {
    const compound = state.compounds.find(c => c.id === ref.compoundId);
    if(!compound) return;
    (compound.effects || []).forEach(effectKey => {
      byEffect[effectKey] = (byEffect[effectKey] || 0) + 1;
    });
  });
  const rows = Object.keys(byEffect).map(key => {
    const count = byEffect[key];
    const lvl = count >= 3 ? 3 : count === 2 ? 2 : 1;
    // pct solo para el ancho de la barra visual, no es un valor clinico.
    const pct = Math.min(100, 40 + count * 22);
    return { key, label: EFFECT_LABELS[key] || {es:key,en:key}, count, lvl, pct };
  }).sort((a,b) => b.count - a.count);
  return rows;
}
function computeCaffeine(recipe){
  const product = state.products.find(p => p.id === recipe.productId);
  const allCompoundRefs = (product ? product.compounds : []).concat(recipe.extraCompounds || []);
  let mg = 0;
  allCompoundRefs.forEach(ref => {
    const compound = state.compounds.find(c => c.id === ref.compoundId);
    if(compound) mg += compound.caffeineMg || 0;
  });
  return mg;
}
function computeNutrition(recipeId){
  const rows = [ { ...NUTRI_BASE } ];
  const recipe = state.recipes.find(r => r.id === recipeId);
  if(recipe){
    (recipe.extraIngredients || []).forEach(ing => rows.push({ es:ing.es, en:ing.en, ...ing.nutri }));
  }
  const total = rows.reduce((a,r) => ({ kcal:a.kcal+r.kcal, p:a.p+r.p, c:a.c+r.c, f:a.f+r.f }), { kcal:0,p:0,c:0,f:0 });
  return { rows, total };
}

function logsForProduct(productId){
  return state.logs.filter(l => l.productId === productId).sort((a,b) => a.startedAt < b.startedAt ? 1 : -1);
}

  const today = nlToday();

/* Racha real: cuenta dias consecutivos con registro terminando hoy o ayer
   (si hoy aun no se registro, la racha "sigue viva" hasta el corte de dia).
   Un dia sin registro NI dia libre usado corta la racha (RF-21). Los dias
   libres (9.2) cubren un hueco sin romperla, y se descuentan de
   freezesAvailable la primera vez que se calculan sobre ese hueco. */
function recomputeStreak(productId){
  const daysWithLog = new Set(state.logs.filter(l => l.productId === productId).map(l => l.startedAt.slice(0,10)));
  if(!daysWithLog.size) return { current:0, longestFound:0 };
  let current = 0;
  let cursor = loggedToday(productId) ? 0 : 1; // si hoy no hay registro, se evalua desde ayer
  const usedFreezeDays = new Set(state.gamification.freezeDaysUsed || []);
  while(true){
    const day = nlDaysAgo(cursor);
    if(daysWithLog.has(day)){ current++; cursor++; continue; }
    if(usedFreezeDays.has(day)){ current++; cursor++; continue; }
    break;
  }
  // Racha mas larga historica: barrido simple sobre los dias con registro.
  const sortedDays = [...daysWithLog].sort();
  let longest = 0, run = 0, prev = null;
  sortedDays.forEach(day => {
    if(prev){
      const diff = (new Date(day) - new Date(prev)) / 86400000;
      run = diff === 1 ? run + 1 : 1;
    } else run = 1;
    longest = Math.max(longest, run);
    prev = day;
  });
  return { current, longestFound: longest };
}
function refreshGamification(){
  const { current, longestFound } = recomputeStreak(state.activeProductId);
  state.gamification.streakCurrent = current;
  state.gamification.streakMax = Math.max(state.gamification.streakMax || 0, longestFound, current);
  refreshBadges();
}
function weekProgress(productId){
  const cfg = state.trackingConfigs.find(t => t.productId === productId);
  const target = cfg && cfg.goal ? (cfg.goal.frequencyTarget || 5) : 5;
  const start = nlDaysAgo(6);
  const count = state.logs.filter(l => l.productId === productId && l.startedAt.slice(0,10) >= start).length;
  return { count, target, pct: Math.min(100, Math.round((count/target)*100)) };
}
function refreshBadges(){
  const g = state.gamification;
  const have = new Set(g.badgeIds || []);
  const logs = state.logs;
  const check = (id, cond) => { if(cond && !have.has(id)) have.add(id); };
  check('first', logs.length >= 1);
  check('streak7', g.streakCurrent >= 7 || g.streakMax >= 7);
  check('streak30', g.streakCurrent >= 30 || g.streakMax >= 30);
  check('recipes3', new Set(logs.filter(l=>l.recipeId).map(l=>l.recipeId)).size >= 3);
  check('early', logs.filter(l => +l.startedAt.slice(11,13) < 9).length >= 10);
  check('afternoon', logs.filter(l => +l.startedAt.slice(11,13) >= 16).length >= 10);
  check('ownrecipe', state.recipes.some(r => r.origin === 'user'));
  check('favorite', state.recipes.some(r => r.favorite));
  check('fivestars', state.recipes.filter(r => r.rating >= 1).length >= 5);
  check('secondproduct', state.products.filter(p => !p.archived).length >= 2);
  const byDay = {};
  logs.forEach(l => { const d = l.startedAt.slice(0,10); (byDay[d] = byDay[d]||[]).push(l); });
  check('double', Object.values(byDay).some(dayLogs => dayLogs.length >= 2));
  check('challenge', state.challenges.some(c => c.status === 'completed'));
  g.badgeIds = [...have];
}

/* ===== Carga / guardado ===== */
async function loadData(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = Object.assign(defaultState(), loaded);
      // Merge profundo minimo de las listas para no perder campos nuevos si el
      // esquema crecio despues de que la persona ya tenia datos guardados.
      ['compounds','products','recipes','trackingConfigs','logs','challengeTemplates','challenges'].forEach(k => {
        if(!Array.isArray(state[k])) state[k] = defaultState()[k];
      });
      state.gamification = Object.assign(defaultState().gamification, loaded.gamification || {});
      state.ui = Object.assign(defaultState().ui, loaded.ui || {});
      state.reminderPref = Object.assign(defaultState().reminderPref, loaded.reminderPref || {});
      if(!loaded.onbPicks) state.onbPicks = {};
    } else {
      state = defaultState();
    }
  }catch(e){
    console.warn('[Nutri Log] No se pudo interpretar el estado guardado, se usa el estado semilla:', e);
    state = defaultState();
  }
  refreshGamification();
  cloudSyncReady = true;
  render();
}
let saveTimer = null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn('[Nutri Log] Fallo al guardar:', e); }
  }, 250);
}
function update(mutator){
  mutator(state);
  refreshGamification();
  saveData();
  render();
}

    showToast(state.lang==='es' ? 'Registro guardado.' : 'Entry saved.', 'check');
  });
}
/* ===== Recetas (RF-11 a RF-14, 6.10, 9.9) ===== */
const TYPE_ICON = { hot:'flame', cold:'snowflake', blend:'blend', other:'utensils' };
function matchesRecipeQuery(recipe, L, query){
  if(!query) return true;
  const q = query.toLowerCase();
  if(recipe.name[L].toLowerCase().includes(q)) return true;
  return (recipe.extraIngredients||[]).some(i => (i[L]||'').toLowerCase().includes(q));
}
function renderRecipes(){
  const L = state.lang, t = T[L].recipes, ui = state.ui;
  const product = activeProduct();
  let list = state.recipes.filter(r => r.productId === product.id);
  if(ui.recipeFilter === 'fav') list = list.filter(r => r.favorite);
  else if(['hot','cold','blend'].includes(ui.recipeFilter)) list = list.filter(r => r.consumptionType === ui.recipeFilter);
  list = list.filter(r => matchesRecipeQuery(r, L, ui.recipeQuery));
  const filters = [ {id:'all',label:t.all}, {id:'fav',label:t.fav}, {id:'hot',label:T[L].log.hot}, {id:'cold',label:T[L].log.cold}, {id:'blend',label:T[L].log.blend} ];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3>${esc(t.title)}</h3>
      <button type="button" class="btn btn-primary" data-nl-recipe-new><i data-lucide="plus" style="width:14px;height:14px"></i>${esc(t.new)}</button>
    </div>
    <input type="text" class="input" placeholder="${esc(t.search)}" value="${esc(ui.recipeQuery)}" data-nl-recipe-search>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${filters.map(f => `<button type="button" class="nl-pill ${ui.recipeFilter===f.id?'active-2':'inactive'}" data-nl-recipe-filter="${f.id}">${esc(f.label)}</button>`).join('')}
    </div>
    ${list.length ? `<div class="nl-grid2">${list.map(r => renderRecipeCard(r, L)).join('')}</div>` : `<div class="nl-empty">${esc(T[L].nutri.empty)}</div>`}
  `;
}
function renderRecipeCard(r, L){
  const effects = computeEffectProfile(r).slice(0,3);
  const caffeine = computeCaffeine(r);
  return `
    <div class="card elev-sm" style="cursor:pointer;" data-nl-recipe-open="${r.id}">
      <div class="nl-thumb"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <span class="card-title">${esc(r.name[L])}</span>
        <button type="button" class="nl-heart ${r.favorite?'on':''}" data-nl-recipe-fav="${r.id}" aria-label="${esc(T[L].detail.fav)}">
          <i data-lucide="heart" style="width:18px;height:18px;${r.favorite?'fill:currentColor':''}"></i>
        </button>
      </div>
      <div class="card-meta"><i data-lucide="${TYPE_ICON[r.consumptionType]}" style="width:12px;height:12px"></i>${esc(T[L].log[r.consumptionType])} · ~${caffeine}mg ${esc(T[L].log.caffeine)}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        ${effects.map(e => `<span class="tag tag-accent">${esc(e.label[L])}</span>`).join('')}
      </div>
      ${r.rating ? `<div>${renderStars(r.rating, false)}</div>` : ''}
    </div>`;
}
function renderStars(rating, editable, recipeId){
  let out = '';
  for(let i=1;i<=5;i++){
    out += `<button type="button" class="nl-star ${i<=rating?'on':''}" ${editable?`data-nl-rate="${recipeId}" data-nl-rate-val="${i}"`:'tabindex="-1" style="cursor:default"'}><i data-lucide="star" style="width:16px;height:16px;${i<=rating?'fill:currentColor':''}"></i></button>`;
  }
  return out;
}
function wireRecipes(){
  const ui = state.ui;
  const search = document.querySelector('[data-nl-recipe-search]');
  if(search) search.addEventListener('input', () => { ui.recipeQuery = search.value; render(); });
  document.querySelectorAll('[data-nl-recipe-filter]').forEach(b => b.addEventListener('click', () => { ui.recipeFilter = b.dataset.nlRecipeFilter; render(); }));
  document.querySelectorAll('[data-nl-recipe-open]').forEach(el => el.addEventListener('click', (ev) => {
    if(ev.target.closest('[data-nl-recipe-fav]')) return;
    ui.openRecipeId = el.dataset.nlRecipeOpen; state.screen = 'recipeDetail'; render();
  }));
  document.querySelectorAll('[data-nl-recipe-fav]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const id = el.dataset.nlRecipeFav;
    update(s => { const r = s.recipes.find(x=>x.id===id); if(r) r.favorite = !r.favorite; });
  }));
  const newBtn = document.querySelector('[data-nl-recipe-new]');
  if(newBtn) newBtn.addEventListener('click', () => openRecipeEditor(null));
}

/* ===== Detalle de receta (RF-14, RF-15, RF-16, RF-35, RF-36) ===== */
function renderRecipeDetail(){
  const L = state.lang, t = T[L].detail;
  const recipe = state.recipes.find(r => r.id === state.ui.openRecipeId) || state.recipes[0];
  if(!recipe) return `<div class="nl-empty">${esc(T[L].nutri.empty)}</div>`;
  const effects = computeEffectProfile(recipe);
  const caffeine = computeCaffeine(recipe);
  const nutri = computeNutrition(recipe.id);
  return `
    <button type="button" class="btn btn-ghost" data-nl-back><i data-lucide="arrow-left" style="width:16px;height:16px"></i>${L==='es'?'Volver':'Back'}</button>
    <div class="nl-thumb-lg"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <span class="card-kicker">${esc(t.kicker)}</span>
        <h3>${esc(recipe.name[L])}</h3>
      </div>
      <button type="button" class="nl-heart ${recipe.favorite?'on':''}" data-nl-recipe-fav="${recipe.id}" title="${esc(recipe.favorite?t.fav:t.notFav)}">
        <i data-lucide="heart" style="width:22px;height:22px;${recipe.favorite?'fill:currentColor':''}"></i>
      </button>
    </div>
    <div style="display:flex;gap:8px;">
      <span class="tag tag-outline">~${caffeine}mg ${esc(T[L].log.caffeine)}</span>
      <span class="tag tag-neutral"><i data-lucide="${TYPE_ICON[recipe.consumptionType]}" style="width:11px;height:11px;display:inline;vertical-align:-1px;"></i> ${esc(T[L].log[recipe.consumptionType])}</span>
    </div>
    <div class="card elev-sm" style="cursor:pointer;flex-direction:row;justify-content:space-between;align-items:center;" data-nl-nutri-open="${recipe.id}">
      <div>
        <div style="font-family:var(--font-heading);font-size:26px;">${nutri.total.kcal} <span style="font-size:14px;">${esc(T[L].nutri.kcal)}</span></div>
        <div class="text-muted" style="font-size:12px;">${esc(T[L].nutri.see || T[L].nutri.title)}</div>
      </div>
      <i data-lucide="chevron-right" style="width:18px;height:18px"></i>
    </div>
    <div class="card elev-sm">
      <span class="card-title">${esc(t.effects)}</span>
      ${effects.length ? effects.map(e => `
        <div class="nl-effect-row nl-effect-lvl${e.lvl}">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;">
            <span>${esc(e.label[L])}</span>
            <span class="text-muted">${L==='es' ? ['','baja','media','alta'][e.lvl] : ['','low','medium','high'][e.lvl]}</span>
          </div>
          <div class="nl-bar-track"><div class="nl-bar-fill" style="width:${e.pct}%"></div></div>
        </div>`).join('') : `<p class="text-muted">${L==='es'?'Sin efectos calculados todavía.':'No calculated effects yet.'}</p>`}
    </div>
    <div class="nl-disclaimer"><i data-lucide="info" style="width:15px;height:15px"></i><span>${esc(T[L].disclaimer)}</span></div>
    <div class="card elev-sm">
      <span class="card-title">${esc(t.ingredients)}</span>
      <ul style="margin:0;padding-left:18px;font-size:13.5px;">${(recipe.extraIngredients||[]).map(i => `<li>${esc(i[L])}</li>`).join('')}</ul>
    </div>
    <div class="card elev-sm">
      <span class="card-title">${esc(t.steps)}</span>
      <ol style="margin:0;padding-left:18px;font-size:13.5px;">${(recipe.steps[L]||[]).map(s => `<li style="margin-bottom:4px;">${esc(s)}</li>`).join('')}</ol>
    </div>
    <div class="card elev-sm">
      <span class="card-title">${esc(t.rate)}</span>
      <div>${renderStars(recipe.rating || 0, true, recipe.id)}</div>
    </div>
    <button type="button" class="btn btn-primary btn-block" data-nl-log-with="${recipe.id}">${esc(t.logThis)}</button>
    ${recipe.origin === 'user' ? `
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-secondary" style="flex:1" data-nl-recipe-edit="${recipe.id}">${esc(t.edit)}</button>
        <button type="button" class="btn btn-secondary" style="flex:1;color:var(--color-accent-800)" data-nl-recipe-delete="${recipe.id}">${esc(t.delete)}</button>
      </div>` : ''}
  `;
}
function wireRecipeDetail(){
  const back = document.querySelector('[data-nl-back]');
  if(back) back.addEventListener('click', () => { state.screen = 'recipes'; render(); });
  document.querySelectorAll('[data-nl-recipe-fav]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.nlRecipeFav;
    update(s => { const r = s.recipes.find(x=>x.id===id); if(r) r.favorite = !r.favorite; });
  }));
  const nutriOpen = document.querySelector('[data-nl-nutri-open]');
  if(nutriOpen) nutriOpen.addEventListener('click', () => {
    state.ui.nutriRecipeId = nutriOpen.dataset.nlNutriOpen; state.screen = 'nutrition'; render();
  });
  document.querySelectorAll('[data-nl-rate]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.nlRate, val = +el.dataset.nlRateVal;
    update(s => { const r = s.recipes.find(x=>x.id===id); if(r) r.rating = (r.rating === val ? null : val); });
  }));
  const logWith = document.querySelector('[data-nl-log-with]');
  if(logWith) logWith.addEventListener('click', () => {
    state.ui.logRecipeId = logWith.dataset.nlLogWith;
    state.screen = 'log'; render();
  });
  const editBtn = document.querySelector('[data-nl-recipe-edit]');
  if(editBtn) editBtn.addEventListener('click', () => openRecipeEditor(editBtn.dataset.nlRecipeEdit));

  if(delBtn) delBtn.addEventListener('click', () => {
    const id = delBtn.dataset.nlRecipeDelete;

/* ===== Editor de receta propia (RF-13) ===== */
function openRecipeEditor(recipeId){
  const L = state.lang;
  const existing = recipeId ? state.recipes.find(r => r.id === recipeId) : null;
  const product = activeProduct();
  const host = document.getElementById('nl-modal-host');
  host.innerHTML = `
    <div class="dialog-backdrop" data-nl-modal-close>
      <div class="dialog" data-nl-modal-stop>
        <span class="dialog-title">${L==='es' ? (existing?'Editar receta':'Nueva receta') : (existing?'Edit recipe':'New recipe')}</span>
        <div class="field"><label>${L==='es'?'Nombre':'Name'}</label><input type="text" class="input" id="nl-re-name" value="${esc(existing ? existing.name[L] : '')}"></div>
        <div class="field"><label>${T[L].log.type}</label>
          <select class="input" id="nl-re-type">
            ${CONSUMPTION_TYPES.map(ty => `<option value="${ty}" ${existing && existing.consumptionType===ty?'selected':''}>${esc(T[L].log[ty])}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${T[L].detail.ingredients} (${L==='es'?'uno por línea':'one per line'})</label>
          <textarea class="input" id="nl-re-ingredients" rows="4">${esc((existing ? existing.extraIngredients.map(i=>i[L]) : []).join('\n'))}</textarea>
        </div>
        <div class="field"><label>${T[L].detail.steps} (${L==='es'?'uno por línea':'one per line'})</label>
          <textarea class="input" id="nl-re-steps" rows="4">${esc((existing ? existing.steps[L] : []).join('\n'))}</textarea>
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" data-nl-modal-close>${L==='es'?'Cancelar':'Cancel'}</button>
          <button type="button" class="btn btn-primary" id="nl-re-save">${L==='es'?'Guardar':'Save'}</button>
        </div>
      </div>
    </div>`;
  icons();
  host.querySelectorAll('[data-nl-modal-close]').forEach(el => el.addEventListener('click', () => { host.innerHTML = ''; }));
  host.querySelector('[data-nl-modal-stop]').addEventListener('click', ev => ev.stopPropagation());
  host.querySelector('#nl-re-save').addEventListener('click', () => {
    const name = host.querySelector('#nl-re-name').value.trim();
    if(!name) return;
    const type = host.querySelector('#nl-re-type').value;
    const ingredientLines = host.querySelector('#nl-re-ingredients').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const stepLines = host.querySelector('#nl-re-steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
    update(s => {
      if(existing){
        const r = s.recipes.find(x => x.id === existing.id);
        r.name[L] = name; r.consumptionType = type;
        r.extraIngredients = ingredientLines.map(line => ({ es:line, en:line, nutri:{kcal:0,p:0,c:0,f:0} }));
        r.steps[L] = stepLines;
      } else {
        s.recipes.push({
          id: uid('recipe'), productId: product.id, name:{es:name,en:name}, consumptionType:type, origin:'user',
          favorite:false, rating:null, extraCompounds:[],
          extraIngredients: ingredientLines.map(line => ({ es:line, en:line, nutri:{kcal:0,p:0,c:0,f:0} })),
          steps: { es: L==='es'?stepLines:[], en: L==='en'?stepLines:[] }
        });
      }
    });
    host.innerHTML = '';
    showToast(L==='es' ? 'Receta guardada.' : 'Recipe saved.', 'check');
  });
}
function openConfirmDialog(message, onConfirm){
  const L = state.lang;
  const host = document.getElementById('nl-modal-host');
  host.innerHTML = `
    <div class="dialog-backdrop" data-nl-modal-close>
      <div class="dialog" data-nl-modal-stop style="width:min(360px,100%)">
        <span class="dialog-title">${L==='es'?'Confirmar':'Confirm'}</span>
        <p style="margin:0;">${esc(message)}</p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" data-nl-modal-close>${L==='es'?'Cancelar':'Cancel'}</button>
          <button type="button" class="btn btn-primary" id="nl-confirm-yes">${L==='es'?'Eliminar':'Delete'}</button>
        </div>
      </div>
    </div>`;
  host.querySelectorAll('[data-nl-modal-close]').forEach(el => el.addEventListener('click', () => { host.innerHTML = ''; }));
  host.querySelector('[data-nl-modal-stop]').addEventListener('click', ev => ev.stopPropagation());
  host.querySelector('#nl-confirm-yes').addEventListener('click', () => { host.innerHTML = ''; onConfirm(); });
}

/* ===== Nutricion (pantalla nueva del handoff, calorias y macros) ===== */
function renderNutrition(){
  const L = state.lang, t = T[L].nutri, product = activeProduct();
  const all = state.recipes.filter(r => r.productId === product.id);
  const ui = state.ui;
  const nr = ui.nutriRecipeId || (all[0] && all[0].id);
  const recipe = state.recipes.find(r => r.id === nr) || all[0];
  if(!recipe) return `<div class="nl-empty">${esc(t.empty)}</div>`;
  const { rows, total } = computeNutrition(recipe.id);
  const kcalFromMacros = { p: total.p*4, c: total.c*4, f: total.f*9 };
  const kcalTotalCheck = kcalFromMacros.p + kcalFromMacros.c + kcalFromMacros.f;
  const pct = v => kcalTotalCheck ? Math.round((v/kcalTotalCheck)*100) : 0;
  const caffeine = computeCaffeine(recipe);
  const filtered = all.filter(r => matchesRecipeQuery(r, L, ui.nutriQuery));
  return `
    <h3>${esc(t.title)}</h3>
    <p class="text-muted" style="margin-top:-8px;">${esc(t.sub)}</p>
    <div class="field" style="position:relative;">
      <div class="input" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" data-nl-nutri-toggle>
        <span>${esc(recipe.name[L])} · ${all.length} ${L==='es'?'recetas':'recipes'}</span>
        <i data-lucide="chevron-down" style="width:16px;height:16px"></i>
      </div>
      ${ui.nutriOpen ? `
        <div class="nl-searchpanel">
          <input type="text" class="input" placeholder="${esc(T[L].recipes.search)}" value="${esc(ui.nutriQuery)}" data-nl-nutri-search>
          <div class="nl-searchlist">
            ${filtered.length ? filtered.map(r => `<div class="nl-searchrow" data-nl-nutri-pick="${r.id}">${esc(r.name[L])} ${r.id===recipe.id?'<i data-lucide=\"check\" style=\"width:14px;height:14px\"></i>':''}</div>`).join('') : `<div class="text-muted" style="padding:8px;font-size:13px;">${esc(t.empty)}</div>`}
          </div>
        </div>` : ''}
    </div>
    <div class="card nl-streak-card elev-md">
      <span style="font-size:12px;opacity:.85;">${esc(t.perServing)}</span>
      <div style="font-family:var(--font-heading);font-size:52px;line-height:1;">${total.kcal}<span style="font-size:16px;"> ${esc(t.kcal)}</span></div>
      <span style="font-size:12.5px;">${esc(recipe.name[L])} · ${esc(T[L].log[recipe.consumptionType])} · ~${caffeine}mg ${esc(T[L].nutri.caffeine || T[L].log.caffeine)}</span>
    </div>
    <div class="card elev-sm nl-col" style="gap:10px;">
      ${[['p',t.protein,total.p,'var(--color-accent)'],['c',t.carbs,total.c,'var(--color-accent-2)'],['f',t.fat,total.f,'var(--color-neutral-500)']].map(([k,label,val]) => `
        <div class="nl-effect-row">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>${esc(label)}</span><span class="text-muted">${val}g · ${pct(kcalFromMacros[k])}%</span></div>
          <div class="nl-bar-track"><div class="nl-bar-fill" style="width:${pct(kcalFromMacros[k])}%;background:${['var(--color-accent)','var(--color-accent-2)','var(--color-neutral-500)'][['p','c','f'].indexOf(k)]}"></div></div>
        </div>`).join('')}
    </div>
    <div class="card elev-sm">
      <span class="card-title">${esc(t.breakdown)}</span>
      <table class="table">
        <thead><tr><th></th><th>${esc(t.kcal)}</th><th>P</th><th>C</th><th>G</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td>${esc(r[L])}</td><td>${r.kcal}</td><td>${r.p}</td><td>${r.c}</td><td>${r.f}</td></tr>`).join('')}
          <tr style="color:var(--color-accent-700);font-weight:700;"><td>${esc(t.total)}</td><td>${total.kcal}</td><td>${total.p}</td><td>${total.c}</td><td>${total.f}</td></tr>
        </tbody>
      </table>
    </div>
    ${renderNutritionAccumulators(product.id, L, t)}
    <p class="text-muted" style="font-size:11.5px;">${esc(t.note)}</p>
  `;
}
function renderNutritionAccumulators(productId, L, t){
  const today = nlToday();
  const logsToday = state.logs.filter(l => l.productId===productId && l.startedAt.slice(0,10)===today);
  const weekStart = nlDaysAgo(6);
  const logsWeek = state.logs.filter(l => l.productId===productId && l.startedAt.slice(0,10)>=weekStart);
  const monthStart = nlDaysAgo(29);
  const logsMonth = state.logs.filter(l => l.productId===productId && l.startedAt.slice(0,10)>=monthStart);
  const kcalOf = log => log.recipeId ? computeNutrition(log.recipeId).total.kcal : NUTRI_BASE.kcal;
  const sumKcal = logs => logs.reduce((a,l) => a + kcalOf(l), 0);
  const avgKcal = logs => logs.length ? Math.round(sumKcal(logs)/logs.length) : 0;
  return `
    <div class="nl-grid2">
      <div class="card elev-sm"><span class="card-kicker">${esc(t.today)}</span><span class="card-title">${sumKcal(logsToday)} ${esc(t.kcal)}</span><span class="text-muted" style="font-size:11.5px;">${logsToday.length} ${L==='es'?'registro(s)':'entr(y/ies)'}</span></div>
      <div class="card elev-sm"><span class="card-kicker">${esc(t.week)}</span><span class="card-title">${avgKcal(logsWeek)} ${esc(t.kcal)}</span><span class="text-muted" style="font-size:11.5px;">${logsWeek.length} · 7 ${L==='es'?'días':'days'}</span></div>
      <div class="card elev-sm"><span class="card-kicker">${esc(t.month)}</span><span class="card-title">${sumKcal(logsMonth)} ${esc(t.kcal)}</span><span class="text-muted" style="font-size:11.5px;">${logsMonth.length} ${L==='es'?'registrados':'logged'}</span></div>
    </div>`;
}
function wireNutrition(){
  const ui = state.ui;
  const toggle = document.querySelector('[data-nl-nutri-toggle]');
  if(toggle) toggle.addEventListener('click', () => { ui.nutriOpen = !ui.nutriOpen; render(); });
  const search = document.querySelector('[data-nl-nutri-search]');
  if(search){ search.addEventListener('input', () => { ui.nutriQuery = search.value; render(); }); search.focus(); }
  document.querySelectorAll('[data-nl-nutri-pick]').forEach(el => el.addEventListener('click', () => {
    ui.nutriRecipeId = el.dataset.nlNutriPick; ui.nutriOpen = false; ui.nutriQuery=''; render();
  }));
}
